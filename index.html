  <style>
    /* Custom scrollbar & animasi gelombang suara */

      animation: wavePulse 0.7s ease-in-out infinite;

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;

      }

    @keyframes splashBarGrow {

    .pb-safe {

    /* SpeakUp visual system: calm editorial surfaces, clear hierarchy, motion with purpose. */
    :root {
      --speak-ink: #10233f;
      --speak-muted: #58708d;
      --speak-brand: #1769e0;
      --speak-brand-dark: #0d4cae;
      --speak-mint: #17a984;
      --speak-ground: #f4f8fc;
      --speak-surface: #ffffff;
      --speak-line: #dce7f2;
      --speak-radius: 24px;
      --speak-ease: cubic-bezier(.2,.8,.2,1);
    }

    body {
      color: var(--speak-ink);
      background: var(--speak-ground);
    }

    #app-shell {
      background: var(--speak-surface);
      border-color: #10233f;
      box-shadow: 0 28px 80px rgba(16, 35, 63, .18);
    }

    #screen-container {
      scroll-behavior: smooth;
      background: var(--speak-ground);
    }

    #screen-container > * {
      min-height: 100%;
    }

    .screen-enter {
      animation: screenArrive .42s var(--speak-ease) both;
    }

    @keyframes screenArrive {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes ambientDrift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -5px, 0); }
    }

    #screen-container section,
    #screen-container header,
    #screen-container form,
    #screen-container .screen-enter > div {
      animation: contentReveal .5s var(--speak-ease) both;
    }

    #screen-container section:nth-child(2) { animation-delay: 70ms; }
    #screen-container section:nth-child(3) { animation-delay: 140ms; }
    #screen-container section:nth-child(4) { animation-delay: 210ms; }

    @keyframes contentReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #screen-container button:not(.nav-btn),

      transition: transform .2s var(--speak-ease), box-shadow .2s ease, background-color .2s ease, border-color .2s ease;

    #google-modal button:hover {
      transform: translateY(-2px);
    }

    #screen-container button:not(.nav-btn):active,

      transform: translateY(0) scale(.98);

    .nav-btn:hover { transform: translateY(-2px); }

    input, select, textarea {
      border-color: var(--speak-line) !important;
      color: var(--speak-ink) !important;
      transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;

    input:hover, select:hover, textarea:hover { border-color: #a8c3df !important; }

      .screen-enter,
      #screen-container section,
      #screen-container header,
      #screen-container form,

    .flip-scene { perspective: 1000px; }
    .flip-card-inner {

        '"': '&quot;',

    function analyzePhraseLocally(phrase) {
      const clean = String(phrase || '').toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim();

      if (LOCAL_PHRASES[clean]) return { ...LOCAL_PHRASES[clean] };

      const topicMatch = getActiveTopics().find((topic) =>
        String(topic.prompt || '').toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim() === clean
      );
      if (topicMatch) {
        return {
          meaning: topicMatch.promptMeaning || topicMatch.sampleMeaning,
          phonetic: topicMatch.promptPhonetic || topicMatch.samplePhonetic,
          explanation: topicMatch.sampleExplanation
        };
      }

      const words = clean.split(' ');
      const meaning = words.map(word => LOCAL_WORDS[word] || word).join(' ');
      const phonetic = words.map(word => LOCAL_PHONETIC[word] || word).join(' ');
      const known = words.filter(word => LOCAL_WORDS[word]).length;
      return {
        meaning: known > 0 ? meaning : `Terjemahan untuk "${phrase}"`,
        phonetic,
        explanation: 'Kamus offline menerjemahkan kata per kata. Aktifkan GEMINI_API_KEY di server agar terjemahan lebih alami dan kontekstual.'
      };
    }

      { id: 4, level: 'Pemula', cat: 'Grammar', q: "Preposisi alat transportasi yang tepat: 'I go to school ___ bicycle.'", options: ["by", "with", "on", "at"], answer: 0, info: "Pakai 'by' sebelum alat transportasi tanpa kata sandang (by bicycle, by bus)." },
      { id: 5, level: 'Pemula', cat: 'Speaking', q: "Ungkapan paling natural untuk menyapa guru di pagi hari adalah...", options: ["Good morning, Sir.", "Good night, Sir.", "See you yesterday, Sir.", "Morning you, Sir."], answer: 0, info: "'Good morning' adalah sapaan sopan di pagi hari." },
      { id: 6, level: 'Pemula', cat: 'Grammar', q: "Pilih 'to be' yang benar: 'She ___ my best friend.'", options: ["is", "am", "are", "be"], answer: 0, info: "Subjek tunggal orang ketiga (he, she, it) selalu memakai 'is'." },
      { id: 7, level: 'Pemula', cat: 'Pronunciation', q: "Kata mana yang memiliki bunyi 'th' lembut seperti pada 'thank'?", options: ["think", "time", "tree", "talk"], answer: 0, info: "'Think' dan 'thank' sama-sama memakai bunyi dental fricative /θ/." },
      { id: 8, level: 'Pemula', cat: 'Vocabulary', q: "Lawan kata (antonym) dari 'early' adalah...", options: ["late", "fast", "soon", "near"], answer: 0, info: "'Early' artinya awal/lebih cepat, lawannya 'late' (terlambat)." },
      { id: 9, level: 'Pemula', cat: 'Grammar', q: "Kalimat yang benar untuk menyatakan kebiasaan harian adalah...", options: ["I wake up at 6 a.m.", "I waking up at 6 a.m.", "I wakes up at 6 a.m.", "I woke up every morning."], answer: 0, info: "Present simple untuk subjek 'I' memakai kata kerja dasar tanpa -s." },
      { id: 10, level: 'Pemula', cat: 'Speaking', q: "Cara sopan meminta seseorang mengulang ucapannya adalah...", options: ["Could you repeat that, please?", "Say again now!", "Repeat it fast!", "I don't hear you, stop."], answer: 0, info: "'Could you repeat that, please?' sopan dan natural dalam percakapan." },
      { id: 11, level: 'Pemula', cat: 'Grammar', q: "Pilih kata ganti kepunyaan yang benar: 'This is ___ notebook.'", options: ["my", "me", "I", "mine"], answer: 0, info: "Sebelum kata benda (notebook), gunakan possessive adjective 'my'." },
      { id: 12, level: 'Pemula', cat: 'Pronunciation', q: "Huruf yang tidak dibaca (silent letter) pada kata 'know' adalah...", options: ["k", "n", "o", "w"], answer: 0, info: "Pada kata 'know' (nou), huruf 'k' di awal tidak dilafalkan." },
      { id: 13, level: 'Pemula', cat: 'Vocabulary', q: "Arti kata 'homework' dalam bahasa Indonesia adalah...", options: ["pekerjaan rumah (PR)", "rumah kerja", "kerja bakti", "pekerjaan kantor"], answer: 0, info: "'Homework' berarti tugas sekolah yang dikerjakan di rumah." },
      { id: 14, level: 'Pemula', cat: 'Grammar', q: "Bentuk jamak (plural) yang tepat dari 'child' adalah...", options: ["children", "childs", "childes", "childrens"], answer: 0, info: "'Child' termasuk irregular plural, bentuk jamaknya 'children'." },
      { id: 15, level: 'Pemula', cat: 'Speaking', q: "Jawaban yang tepat untuk pertanyaan 'How are you?' adalah...", options: ["I am doing well, thank you.", "I am twelve years old.", "I live in Jakarta.", "My name is Budi."], answer: 0, info: "'How are you?' menanyakan kabar, bukan umur atau alamat." },
      { id: 16, level: 'Pemula', cat: 'Grammar', q: "Preposisi hari yang tepat: 'We have English class ___ Monday.'", options: ["on", "in", "at", "by"], answer: 0, info: "Gunakan 'on' sebelum nama hari (on Monday, on Friday)." },
      { id: 17, level: 'Pemula', cat: 'Vocabulary', q: "Kata 'library' merujuk pada tempat untuk...", options: ["membaca dan meminjam buku", "membeli makanan ringan", "bermain sepak bola", "menunggu bus sekolah"], answer: 0, info: "'Library' artinya perpustakaan." },
      { id: 18, level: 'Pemula', cat: 'Grammar', q: "Pilih kalimat negatif yang benar: 'He ___ like spicy food.'", options: ["does not", "do not", "is not", "are not"], answer: 0, info: "Untuk subjek 'he/she/it' di present simple, gunakan 'does not' (doesn't)." },
      { id: 19, level: 'Pemula', cat: 'Pronunciation', q: "Bagaimana pelafalan umum kata 'Wednesday'?", options: ["wenz-dei", "wed-nes-dei", "wid-nes-dai", "wen-dis-dei"], answer: 0, info: "Huruf 'd' pertama dan 'e' kedua pada 'Wednesday' luluh menjadi 'wenz-dei'." },
      { id: 20, level: 'Pemula', cat: 'Grammar', q: "Preposisi bulan yang tepat: 'My birthday is ___ August.'", options: ["in", "on", "at", "to"], answer: 0, info: "Gunakan 'in' sebelum nama bulan atau tahun (in August, in 2026)." },
      { id: 21, level: 'Pemula', cat: 'Speaking', q: "Kalimat yang benar untuk memperkenalkan diri adalah...", options: ["Hello, my name is Raka.", "Hello, I name is Raka.", "Hello, me name Raka.", "Hello, my name are Raka."], answer: 0, info: "Gunakan 'My name is ...' atau 'I am ...'." },
      { id: 22, level: 'Pemula', cat: 'Vocabulary', q: "Sinonim dari kata 'happy' adalah...", options: ["glad", "sad", "tired", "angry"], answer: 0, info: "'Glad' bermakna senang/bahagia seperti 'happy'." },
      { id: 23, level: 'Pemula', cat: 'Grammar', q: "Pilih kata tanya yang tepat: '___ do you live?'", options: ["Where", "Who", "When", "Why"], answer: 0, info: "'Where' digunakan untuk menanyakan tempat tinggal atau lokasi." },
      { id: 24, level: 'Pemula', cat: 'Pronunciation', q: "Kata mana yang pelafalannya mirip dengan 'see'?", options: ["sea", "say", "saw", "so"], answer: 0, info: "'See' dan 'sea' adalah homofon yang keduanya dilafalkan /siː/." },
      { id: 25, level: 'Pemula', cat: 'Speaking', q: "Ungkapan terima kasih yang paling sesuai setelah dibantu teman adalah...", options: ["Thank you so much for your help.", "You are welcome very much.", "Never mind for helping.", "Excuse me for your help."], answer: 0, info: "'Thank you so much for your help' menyatakan apresiasi dengan jelas." },

      // ==================== LEVEL 2: MENENGAH (26 - 50) ====================
      { id: 26, level: 'Menengah', cat: 'Grammar', q: "Bentuk kata kerja yang tepat setelah 'like': 'I like ___ books.'", options: ["reading", "read", "reads", "readed"], answer: 0, info: "Setelah 'like' untuk menyatakan hobi, gunakan bentuk gerund (-ing)." },
      { id: 27, level: 'Menengah', cat: 'Grammar', q: "Kalimat yang benar untuk rencana akhir pekan adalah...", options: ["I am going to visit my cousin.", "I going to visit my cousin.", "I am go to visit my cousin.", "I will to visit my cousin."], answer: 0, info: "Pola rencana masa depan: subject + am/is/are + going to + verb 1." },
      { id: 28, level: 'Menengah', cat: 'Grammar', q: "Kata 'confidently' dalam 'I speak confidently' berfungsi sebagai...", options: ["kata keterangan (adverb)", "kata benda (noun)", "kata sifat (adjective)", "kata depan (preposition)"], answer: 0, info: "Adverb berakhiran -ly menjelaskan bagaimana suatu tindakan dilakukan." },
      { id: 29, level: 'Menengah', cat: 'Vocabulary', q: "Manakah penulisan yang benar untuk 'kosakata baru'?", options: ["new vocabulary", "new vocabularies", "a new vocabularies", "news vocabulary"], answer: 0, info: "'Vocabulary' umumnya digunakan sebagai uncountable noun." },
      { id: 30, level: 'Menengah', cat: 'Grammar', q: "Bentuk lampau (past tense) dari kalimat 'She goes to the market' adalah...", options: ["She went to the market.", "She goed to the market.", "She gone to the market.", "She going to the market."], answer: 0, info: "Kata kerja 'go' adalah irregular verb: go -> went -> gone." },
      { id: 31, level: 'Menengah', cat: 'Speaking', q: "Frasa yang tepat untuk menyampaikan pendapat secara sopan adalah...", options: ["In my opinion, practicing daily helps a lot.", "My opinion is you must agree.", "I opinion that practicing helps.", "Opinion me, practicing is good."], answer: 0, info: "'In my opinion, ...' adalah pembuka opini yang natural." },
      { id: 32, level: 'Menengah', cat: 'Grammar', q: "Pilih modal verb untuk memberi saran: 'You ___ practice speaking every day.'", options: ["should", "might not to", "must to", "can to"], answer: 0, info: "'Should' dipakai untuk saran dan diikuti langsung verb 1 tanpa 'to'." },
      { id: 33, level: 'Menengah', cat: 'Vocabulary', q: "Arti phrasal verb 'give up' dalam kalimat 'Never give up!' adalah...", options: ["menyerah", "memberikan hadiah", "bangun tidur", "melihat ke atas"], answer: 0, info: "'Give up' berarti menyerah atau berhenti berusaha." },
      { id: 34, level: 'Menengah', cat: 'Grammar', q: "Kalimat present continuous yang benar untuk kejadian sekarang adalah...", options: ["They are practicing English right now.", "They practicing English right now.", "They is practicing English right now.", "They are practice English right now."], answer: 0, info: "Present continuous: subject + am/is/are + verb-ing." },
      { id: 35, level: 'Menengah', cat: 'Pronunciation', q: "Huruf mana yang tidak dilafalkan pada kata 'listen'?", options: ["t", "l", "s", "n"], answer: 0, info: "Kata 'listen' dilafalkan 'lisen', huruf 't' bersifat silent." },
      { id: 36, level: 'Menengah', cat: 'Grammar', q: "Pilih kata penghubung yang tepat: 'I was tired, ___ I finished my homework.'", options: ["but", "because", "so that", "unless"], answer: 0, info: "'But' menghubungkan dua gagasan yang kontras." },
      { id: 37, level: 'Menengah', cat: 'Vocabulary', q: "Arti phrasal verb 'look forward to' adalah...", options: ["menantikan dengan antusias", "melihat ke belakang", "mencari barang hilang", "mengabaikan jadwal"], answer: 0, info: "'I look forward to meeting you' berarti saya menantikan pertemuan itu." },
      { id: 38, level: 'Menengah', cat: 'Grammar', q: "Lengkapi kalimat: 'There ___ many students in the auditorium yesterday.'", options: ["were", "was", "is", "are"], answer: 0, info: "Subjek jamak (many students) di masa lampau (yesterday) memakai 'were'." },
      { id: 39, level: 'Menengah', cat: 'Speaking', q: "Cara tepat menanyakan arah ke stasiun terdekat adalah...", options: ["Excuse me, how do I get to the nearest station?", "Hey, where station near?", "Tell me station road now.", "Do you know go station?"], answer: 0, info: "'How do I get to ...?' adalah pola baku dan sopan menanyakan arah." },
      { id: 40, level: 'Menengah', cat: 'Grammar', q: "Pilih kata yang tepat untuk benda yang bisa dihitung: 'How ___ books did you read?'", options: ["many", "much", "little", "less"], answer: 0, info: "'Many' digunakan untuk countable plural nouns seperti books." },
      { id: 41, level: 'Menengah', cat: 'Pronunciation', q: "Akhiran '-ed' pada kata 'worked' dilafalkan dengan bunyi...", options: ["/t/", "/id/", "/d/", "/ed/"], answer: 0, info: "Setelah konsonan tak bersuara seperti /k/, akhiran -ed dibaca /t/ (workt)." },
      { id: 42, level: 'Menengah', cat: 'Vocabulary', q: "Kata 'improve' paling dekat artinya dengan...", options: ["meningkatkan", "menghapus", "mengurangi", "menunda"], answer: 0, info: "'Improve' berarti memperbaiki atau meningkatkan kualitas." },
      { id: 43, level: 'Menengah', cat: 'Grammar', q: "Bentuk comparative dari kata sifat 'good' adalah...", options: ["better", "gooder", "more good", "best"], answer: 0, info: "'Good' tidak beraturan: good -> better -> best." },
      { id: 44, level: 'Menengah', cat: 'Speaking', q: "Respons sopan saat tidak setuju dengan ide teman dalam diskusi adalah...", options: ["I see your point, but I have a different idea.", "Your idea is totally wrong.", "No, do not say that.", "I disagree you completely."], answer: 0, info: "Menghargai sudut pandang lawan bicara terlebih dahulu membuat diskusi konstruktif." },
      { id: 45, level: 'Menengah', cat: 'Grammar', q: "Lengkapi kalimat: 'She has lived in Bandung ___ 2021.'", options: ["since", "for", "from", "during"], answer: 0, info: "'Since' dipakai untuk titik awal waktu (since 2021), sedangkan 'for' untuk durasi." },
      { id: 46, level: 'Menengah', cat: 'Vocabulary', q: "Arti phrasal verb 'turn down' dalam 'He turned down the offer' adalah...", options: ["menolak", "menerima", "memperbesar", "menyalakan"], answer: 0, info: "'Turn down' dapat berarti menolak tawaran atau mengecilkan volume." },
      { id: 47, level: 'Menengah', cat: 'Grammar', q: "Kalimat tanya past simple yang benar adalah...", options: ["Did you watch the match last night?", "Did you watched the match last night?", "Do you watched the match last night?", "Were you watch the match last night?"], answer: 0, info: "Setelah auxiliary 'Did', kata kerja kembali ke bentuk dasar (watch)." },
      { id: 48, level: 'Menengah', cat: 'Pronunciation', q: "Kata mana yang memiliki penekanan (stress) pada suku kata KEDUA?", options: ["begin", "table", "happy", "student"], answer: 0, info: "'Begin' ditekan pada suku kata kedua: be-GIN." },
      { id: 49, level: 'Menengah', cat: 'Grammar', q: "Pilih pronoun refleksif yang tepat: 'We prepared the presentation by ___.'", options: ["ourselves", "ourself", "us", "themselves"], answer: 0, info: "Bentuk refleksif jamak dari 'we' adalah 'ourselves'." },
      { id: 50, level: 'Menengah', cat: 'Speaking', q: "Kalimat yang tepat untuk menutup percakapan telepon secara sopan adalah...", options: ["Thank you for calling. Have a great day!", "I close the phone now.", "Stop talking, bye.", "Finish call, thank you."], answer: 0, info: "'Thank you for calling. Have a great day!' terdengar ramah dan profesional." },

      // ==================== LEVEL 3: LANJUT (51 - 75) ====================
      { id: 51, level: 'Lanjut', cat: 'Grammar', q: "Pilih perbandingan yang tepat: 'Practicing aloud is ___ than reading silently.'", options: ["more effective", "effectiver", "most effective", "very effective"], answer: 0, info: "Kata sifat 3 suku kata atau lebih memakai 'more ... than'." },
      { id: 52, level: 'Lanjut', cat: 'Speaking', q: "Frasa pembuka presentasi yang paling sopan dan formal adalah...", options: ["I would like to share our findings today.", "I want tell you our findings.", "Listen to me right now.", "I gonna talk about findings."], answer: 0, info: "'I would like to share...' adalah standar profesional untuk presentasi." },
      { id: 53, level: 'Lanjut', cat: 'Grammar', q: "Kata kerja yang tepat: 'A meaningful career ___ positively to the community.'", options: ["contributes", "contribute", "contributing", "contributed to"], answer: 0, info: "Subjek tunggal orang ketiga ('A meaningful career') membutuhkan akhiran -s." },
      { id: 54, level: 'Lanjut', cat: 'Vocabulary', q: "Sinonim paling tepat untuk 'practical' dalam 'practical ways' adalah...", options: ["praktis dan mudah diterapkan", "rumit dan panjang", "mahal dan langka", "teoretis semata"], answer: 0, info: "'Practical' berarti realistis dan dapat langsung dipraktikkan." },
      { id: 55, level: 'Lanjut', cat: 'Grammar', q: "Lengkapi conditional type 1: 'If you practice regularly, your fluency ___.'", options: ["will improve", "would improved", "improved", "improving"], answer: 0, info: "Conditional type 1: If + present simple, will + verb 1." },
      { id: 56, level: 'Lanjut', cat: 'Grammar', q: "Lengkapi conditional type 2: 'If I ___ more time, I would learn Japanese too.'", options: ["had", "have", "will have", "am having"], answer: 0, info: "Conditional type 2 (pengandaian saat ini) memakai past simple di klausa 'if'." },
      { id: 57, level: 'Lanjut', cat: 'Grammar', q: "Bentuk kalimat pasif (passive voice) dari 'The teacher praised the students' adalah...", options: ["The students were praised by the teacher.", "The students was praised by the teacher.", "The students are praising by the teacher.", "The students praised by the teacher."], answer: 0, info: "Past simple passive: plural subject + were + verb 3 (praised)." },
      { id: 58, level: 'Lanjut', cat: 'Grammar', q: "Pilih kata hubung yang tepat: '___ the heavy rain, the team arrived on time.'", options: ["Despite", "Although", "Even though", "However"], answer: 0, info: "'Despite' diikuti oleh frasa kata benda (the heavy rain), bukan klausa lengkap." },
      { id: 59, level: 'Lanjut', cat: 'Grammar', q: "Pilih kata hubung yang tepat: '___ it rained heavily, the team arrived on time.'", options: ["Although", "Despite", "In spite of", "Because of"], answer: 0, info: "'Although' diikuti subjek + kata kerja (it rained)." },
      { id: 60, level: 'Lanjut', cat: 'Vocabulary', q: "Kolokasi (collocation) yang paling alami dalam bahasa Inggris adalah...", options: ["make a decision", "do a decision", "create a decision", "build a decision"], answer: 0, info: "Pasangan kata yang baku adalah 'make a decision', bukan 'do a decision'." },
      { id: 61, level: 'Lanjut', cat: 'Speaking', q: "Frasa transisi terbaik untuk pindah ke poin berikutnya saat presentasi adalah...", options: ["Moving on to our next point, ...", "Jump next topic now, ...", "Finish this, go other, ...", "Nextly I want say, ..."], answer: 0, info: "'Moving on to our next point' menjaga alur presentasi tetap halus." },
      { id: 62, level: 'Lanjut', cat: 'Grammar', q: "Pilih relative pronoun yang tepat: 'The mentor ___ guided me works at a tech firm.'", options: ["who", "which", "whose", "where"], answer: 0, info: "'Who' digunakan sebagai subjek klausa relatif untuk merujuk pada orang." },
      { id: 63, level: 'Lanjut', cat: 'Pronunciation', q: "Kata mana yang memiliki huruf 'b' tidak dibaca (silent b)?", options: ["subtle", "habit", "public", "number"], answer: 0, info: "Pada 'subtle' (sat-el), huruf 'b' tidak dilafalkan." },
      { id: 64, level: 'Lanjut', cat: 'Vocabulary', q: "Arti dari 'consistent' dalam konteks belajar bahasa adalah...", options: ["teratur dan berkesinambungan", "cepat bosan", "kadang-kadang saja", "terlalu kaku"], answer: 0, info: "'Consistent' berarti dilakukan secara rutin tanpa putus." },
      { id: 65, level: 'Lanjut', cat: 'Grammar', q: "Lengkapi kalimat: 'She is interested ___ developing public speaking skills.'", options: ["in", "on", "at", "for"], answer: 0, info: "Pasangan preposisi baku adalah 'interested in + noun/gerund'." },
      { id: 66, level: 'Lanjut', cat: 'Grammar', q: "Pilih kalimat dengan reported speech yang benar dari: He said, 'I am ready.'", options: ["He said that he was ready.", "He said that he is ready yesterday.", "He said that I was ready.", "He told that he was ready."], answer: 0, info: "Pada reported speech bentuk lampau, 'am' bergeser menjadi 'was'." },
      { id: 67, level: 'Lanjut', cat: 'Vocabulary', q: "Arti idiom 'break the ice' dalam pertemuan baru adalah...", options: ["mencairkan suasana canggung", "memecahkan es batu", "menghentikan rapat", "membuat konflik baru"], answer: 0, info: "'Break the ice' berarti memulai obrolan agar suasana lebih santai." },
      { id: 68, level: 'Lanjut', cat: 'Grammar', q: "Pilih kalimat yang benar untuk menyatakan kebiasaan masa lalu yang sudah berhenti:", options: ["I used to be shy when speaking English.", "I use to be shy when speaking English.", "I am used to shy when speaking English.", "I using to be shy when speaking English."], answer: 0, info: "'Used to + verb 1' menyatakan kebiasaan atau kondisi di masa lalu." },
      { id: 69, level: 'Lanjut', cat: 'Speaking', q: "Cara profesional meminta klarifikasi dalam rapat adalah...", options: ["Could you clarify what you mean by that?", "What are you even talking about?", "Your point makes zero sense.", "Explain again because I confused."], answer: 0, info: "'Could you clarify...?' terdengar profesional dan fokus pada solusi." },
      { id: 70, level: 'Lanjut', cat: 'Grammar', q: "Pilih bentuk kata kerja yang tepat: 'Neither the coach nor the players ___ late.'", options: ["were", "was", "is", "has been"], answer: 0, info: "Pada 'neither ... nor ...', kata kerja mengikuti subjek terdekat ('the players' = jamak)." },
      { id: 71, level: 'Lanjut', cat: 'Vocabulary', q: "Kolokasi yang benar untuk 'mengambil tanggung jawab' adalah...", options: ["take responsibility", "make responsibility", "do responsibility", "give responsibility"], answer: 0, info: "Ungkapan baku untuk memikul tanggung jawab adalah 'take responsibility'." },
      { id: 72, level: 'Lanjut', cat: 'Pronunciation', q: "Pada kata 'comfortable', jumlah suku kata yang umum diucapkan penutur asli adalah...", options: ["3 suku kata (kamf-ter-bel)", "5 suku kata (kom-for-ta-be-el)", "2 suku kata (kam-fel)", "6 suku kata"], answer: 0, info: "Dalam percakapan alami, 'comfortable' biasanya diucapkan 3 suku kata: /ˈkʌmf.tə.bəl/." },
      { id: 73, level: 'Lanjut', cat: 'Grammar', q: "Lengkapi kalimat: 'By the time we arrived, the workshop ___ already started.'", options: ["had", "has", "have", "was"], answer: 0, info: "Past perfect ('had + V3') menunjukkan aksi yang selesai sebelum kejadian lampau lain." },
      { id: 74, level: 'Lanjut', cat: 'Vocabulary', q: "Arti dari 'fluency' dalam kemampuan speaking adalah...", options: ["kelancaran berbicara tanpa jeda kaku", "kecepatan mengetik di komputer", "jumlah halaman yang dibaca", "volume suara saat berbicara"], answer: 0, info: "'Fluency' menilai kelancaran dan alur bicara secara alami." },
      { id: 75, level: 'Lanjut', cat: 'Speaking', q: "Frasa penutup presentasi yang kuat sebelum sesi tanya jawab adalah...", options: ["Thank you for your attention. I welcome any questions.", "That is all, do not ask.", "Finished now, you can go.", "Thank you, no more slides."], answer: 0, info: "Menutup dengan apresiasi dan membuka ruang tanya jawab mencerminkan kesiapan." },

      // ==================== LEVEL 4: MASTER / TERTINGGI (76 - 100) ====================
      { id: 76, level: 'Master', cat: 'Grammar', q: "Lengkapi conditional type 3: 'If she had practiced earlier, she ___ the debate.'", options: ["would have won", "will have won", "would win", "had won"], answer: 0, info: "Conditional type 3 (penyesalan masa lalu): If + had V3, would have + V3." },
      { id: 77, level: 'Master', cat: 'Grammar', q: "Pilih kalimat inversi (inversion) yang gramatikal untuk penekanan formal:", options: ["Never have I seen such remarkable progress.", "Never I have seen such remarkable progress.", "Never did I saw such remarkable progress.", "Never have I saw such remarkable progress."], answer: 0, info: "Adverb negatif di awal kalimat ('Never') memicu inversi auxiliary + subjek." },
      { id: 78, level: 'Master', cat: 'Grammar', q: "Pilih bentuk subjunctive yang tepat: 'The committee recommended that he ___ early.'", options: ["submit", "submits", "submitted", "submitting"], answer: 0, info: "Mandative subjunctive setelah 'recommended that' memakai bare infinitive (submit)." },
      { id: 79, level: 'Master', cat: 'Usage', q: "Pilih penggunaan 'fewer' vs 'less' yang tepat:", options: ["There were fewer errors in her second recording.", "There were less errors in her second recording.", "There was fewer water in the bottle.", "We need fewer information today."], answer: 0, info: "'Fewer' untuk benda jamak terhitung (errors); 'less' untuk benda tak terhitung." },

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'bg-slate-900 text-white',
        success: 'bg-mint-600 text-white',
        warning: 'bg-amber-500 text-white',
        error: 'bg-rose-600 text-white'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-2xl text-xs font-medium shadow-lg flex items-center gap-2 screen-enter ${colors[type] || colors.info}`;
      toast.setAttribute('role', 'status');
      const text = document.createElement('span');
      text.textContent = String(message == null ? '' : message);
      toast.appendChild(text);
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    function speakEnglish(text, rateOverride = null, langOverride = null) {
      if (!('speechSynthesis' in window)) {
        showToast('Browser tidak mendukung pemutar suara otomatis.', 'warning');
        return;
      }
      const clean = String(text == null ? '' : text).trim();
      if (!clean) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = langOverride || (state.speechSettings ? state.speechSettings.accent : 'en-US');
      utterance.rate = rateOverride != null ? rateOverride : (state.speechSettings ? state.speechSettings.rate : 0.95);
      utterance.onerror = () => showToast('Suara tidak dapat diputar di perangkat ini.', 'warning');
      window.speechSynthesis.speak(utterance);
    }

    function speakTopicPrompt() {
      const topic = getCurrentTopic();
      if (topic) speakEnglish(topic.prompt);
    }

    function speakTranslation() {
      const input = document.getElementById('translate-input');
      const text = input ? input.value.trim() : state.translation.inputText;
      speakEnglish(text);
    }

    let googleIdentityServicesPromise;

    function loadGoogleIdentityServices() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        return Promise.resolve();
      }
      if (googleIdentityServicesPromise) return googleIdentityServicesPromise;

      googleIdentityServicesPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.onload = () => {
          if (window.google && window.google.accounts && window.google.accounts.id) {
            resolve();
          } else {
            reject(new Error('Google Identity Services tidak tersedia.'));
          }
        };
        script.onerror = () => reject(new Error('Gagal memuat Google Identity Services.'));
        document.head.appendChild(script);
      });

      return googleIdentityServicesPromise;
    }

    let googleGisInitializedClientId = '';

    async function renderGISButton() {
      const container = document.getElementById('google-gis-button');
      const clientId = state.googleClientId;
      if (!container || !clientId) return;

      if (window.location.protocol === 'file:') {
        container.innerHTML = '<p class="text-[11px] text-slate-500 text-center px-2 leading-relaxed">Login Google hanya tersedia pada versi online (https). Buka aplikasi lewat URL server atau hosting, atau gunakan login email/nomor HP.</p>';
        return;
      }

      try {
        await loadGoogleIdentityServices();
        if (!container.isConnected || clientId !== state.googleClientId) return;

        if (googleGisInitializedClientId !== clientId) {
          window.google.accounts.id.initialize({
            client_id: clientId,
            callback: handleGoogleCredential
          });
          googleGisInitializedClientId = clientId;
        }
        container.innerHTML = '';
        window.google.accounts.id.renderButton(container, {
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'pill',
          width: 320
        });
      } catch (error) {
        googleIdentityServicesPromise = null;
        console.error('Google Identity Services gagal dimuat:', error);
        showToast('Tidak dapat memuat tombol Google. Periksa koneksi lalu coba lagi.', 'error');
      }
    }

    function handleGoogleCredential(response) {
      if (!response || typeof response.credential !== 'string') {
        showToast('Google tidak mengirim kredensial yang valid.', 'error');
        return;
      }
      loginWithGoogleCredential(response.credential);
    }

    function closeGoogleAccountModal() {
      state.googleModal.isOpen = false;
      state.googleModal.step = 'picker';
      state.googleModal.pendingCredential = '';
      state.googleModal.statusMessage = '';
      state.googleModal.errorMessage = '';
      renderGoogleModal();
    }

    function decodeGoogleCredential(credential) {
      // Dekode klaim dasar ID token Google di sisi klien (server tetap
      // memverifikasi token penuh sebelum membuat sesi).
      let claims;
      try {
        const payload = String(credential).split('.')[1];
        if (!payload) throw new Error('Token Google tidak memiliki payload.');
        const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
        const paddedBase64 = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
        const payloadBytes = Uint8Array.from(atob(paddedBase64), char => char.charCodeAt(0));
        claims = JSON.parse(new TextDecoder().decode(payloadBytes));
      } catch (error) {
        console.error('Kredensial Google tidak dapat dibaca:', error);
        return null;
      }
      return claims && typeof claims === 'object' ? claims : null;
    }

    function validateGoogleClaims(claims) {
      const validAudience = claims.aud === state.googleClientId ||
        (Array.isArray(claims.aud) && claims.aud.includes(state.googleClientId));
      const validIssuer = claims.iss === 'https://accounts.google.com' ||
        claims.iss === 'accounts.google.com';
      return Boolean(validAudience && validIssuer && Number.isFinite(claims.exp) &&
        claims.exp > Date.now() / 1000 &&
        claims.email_verified === true && claims.sub && claims.email);
    }

    async function loginWithGoogleCredential(credential) {
      const claims = decodeGoogleCredential(credential);
      if (!claims || !validateGoogleClaims(claims)) {
        showToast('Identitas Google tidak lengkap atau tidak sesuai Client ID ini.', 'error');
        closeGoogleAccountModal();
        return;
      }

      const email = String(claims.email).toLowerCase();
      state.googleModal.selectedCandidate = {
        name: claims.name || email.split('@')[0],
        email,
        googleSub: claims.sub,
        credential,
        avatarColor: 'from-emerald-500 to-teal-600'
      };
      state.googleModal.pendingCredential = credential;
      state.googleModal.step = 'linking-existing';
      state.googleModal.statusMessage = `Memverifikasi akun Google (${email})...`;
      renderGoogleModal();

      try {
        const result = await apiRequest('/api/auth/google', {
          method: 'POST',
          body: JSON.stringify({ credential })
        });
        if (!result || !result.user) {
          throw new Error('Server tidak mengembalikan data akun. Coba lagi.');
        }
        applyAuthenticatedUser(result.user);
        if (result.warning) showToast(result.warning, 'warning');

        if (result.isNewUser || !state.user.onboardingComplete) {
          if (result.isNewUser) {
            // Akun Google baru: minta pilihan jenjang sebelum onboarding.
            state.googleModal.isOpen = true;
            state.googleModal.pendingEducation = ['SMP', 'SMA', 'SMK'].includes(state.user.education) ? state.user.education : 'SMA';
            state.googleModal.step = 'choose-education';
            state.googleModal.errorMessage = '';
            renderGoogleModal();
            return;
          }
          closeGoogleAccountModal();
          navigate(state.user.privacyAgreed ? 'level' : 'consent');
          return;
        }

        closeGoogleAccountModal();
        showToast(`Selamat datang kembali, ${state.user.name}!`, 'success');
        navigate('home');
      } catch (error) {
        // Jangan tutup modal: tampilkan pesan agar pengguna tahu penyebabnya.
        state.googleModal.isOpen = true;
        state.googleModal.step = 'error';
        state.googleModal.errorMessage = error.message || 'Login Google gagal. Coba lagi.';
        renderGoogleModal();
        showToast(error.message, 'error');
      }
    }

    function setGoogleEducation(edu) {
      state.googleModal.pendingEducation = ['SMP', 'SMA', 'SMK'].includes(edu) ? edu : 'SMA';
      renderGoogleModal();
    }

    async function confirmGoogleEducation() {
      const edu = ['SMP', 'SMA', 'SMK'].includes(state.googleModal.pendingEducation) ? state.googleModal.pendingEducation : 'SMA';
      try {
        await saveAuthenticatedProfile({ education: edu });
        closeGoogleAccountModal();
        showToast(`Akun SpeakUp dibuat & ditautkan ke Google. Selamat datang, ${state.user.name}!`, 'success');
        navigate('consent');
      } catch (error) {
        state.googleModal.isOpen = true;
        state.googleModal.step = 'error';
        state.googleModal.errorMessage = error.message || 'Profil gagal disimpan. Coba lagi.';
        renderGoogleModal();
        showToast(error.message, 'error');
      }
    }

        render();
      } catch (error) {
        showToast(error.message, 'error');

    }

    async function checkSessionAfterSplash() {
      if (state.resetToken) {
        state.checkingSession = false;
        navigate('reset');
        return;
      }
      try {
        const result = await apiRequest('/api/auth/me');
        if (!result || !result.user) {
          const err = new Error('Sesi tidak ditemukan. Silakan masuk kembali.');
          err.status = 401;
          throw err;

        applyAuthenticatedUser(result.user);
        state.checkingSession = false;
        // 1.3 Cek sesi masuk: Jika siswa sudah pernah masuk, langsung ke Beranda (atau lanjut registrasi jika belum selesai)
        navigate(state.user.onboardingComplete ? 'home' : state.user.privacyAgreed ? 'level' : 'consent');

        state.checkingSession = false;
        if (error.status && error.status !== 401) {
          showToast(error.message, 'error');
        }
        // Pertama kali membuka: tampil onboarding 3 layar sebelum Login
        const seenOnboarding = safeStorageGet('speakup_onboarding_seen') === '1';
        if (!seenOnboarding) {
          state.onboardingStep = 0;
          navigate('onboarding');
        } else {

      }

    const LOCAL_SESSION_KEY = 'speakup_session_token';

    function normalizeClientIdentifier(value) {
      if (typeof value !== 'string') return null;
      const identifier = value.trim();
      if (!identifier || identifier.length > 254) return null;
      if (identifier.includes('@')) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)) return null;
        return { email: identifier.toLowerCase(), phone: null };
      }
      const phoneInput = identifier.replace(/[\s().-]/g, '');
      let phone = phoneInput;
      if (/^08\d{8,11}$/.test(phoneInput)) {
        phone = `+62${phoneInput.slice(1)}`;
      } else if (/^62\d{8,13}$/.test(phoneInput)) {
        phone = `+${phoneInput}`;
      } else if (/^0[1-9]\d{7,13}$/.test(phoneInput)) {
        phone = `+62${phoneInput.slice(1)}`;
      }
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) return null;
      return { email: null, phone };
    }

    function normalizeClientReminderTime(value) {
      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (/^([01]\d|2[0-3]):[0-5]\d$/.test(trimmed)) return trimmed;
        const hmMatch = trimmed.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?$/);
        if (hmMatch) {
          const h = Number(hmMatch[1]);
          const m = Number(hmMatch[2]);
          if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          }
        }
        const parsed = new Date(trimmed);
        if (!Number.isNaN(parsed.getTime())) {
          return `${String(parsed.getHours()).padStart(2, '0')}:${String(parsed.getMinutes()).padStart(2, '0')}`;
        }
      }
      return DEFAULT_REMINDER_TIME;
    }

    function toClientPublicUser(row) {
      const intOr = (value, fallback) => {
        const number = Number(value);
        return Number.isFinite(number) ? Math.trunc(number) : fallback;
      };
      const googleLinked = Boolean(Number(row.google_linked ?? row.googleLinked ?? 0));
      return {
        id: String(row.id),
        name: row.name,
        email: row.email || null,
        phone: row.phone || null,
        education: row.education || 'SMA',
        level: row.level || 'Pemula',
        streak: intOr(row.streak, 0),
        newWords: intOr(row.new_words ?? row.newWords, 0),
        weeklyProgress: intOr(row.weekly_progress ?? row.weeklyProgress, 0),
        provider: googleLinked ? 'google' : 'email',
        googleLinked,
        googleEmail: row.google_email || row.googleEmail || null,
        reminderTime: normalizeClientReminderTime(row.reminder_time || row.reminderTime),
        micPermission: Boolean(Number(row.mic_permission ?? row.micPermission ?? 0)),
        privacyAgreed: Boolean(Number(row.privacy_agreed ?? row.privacyAgreed ?? 0)),
        parentalAgreed: Boolean(Number(row.parental_agreed ?? row.parentalAgreed ?? 0)),
        onboardingComplete: Boolean(Number(row.onboarding_complete ?? row.onboardingComplete ?? 0))
      };
    }

    async function sha256Hex(input) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 0;
      for (let i = 0; i < input.length; i++) {
        h = ((h << 5) - h) + input.charCodeAt(i);
        h |= 0;
      }
      return 'fallback-' + Math.abs(h).toString(16);
    }

    async function callDirectAppsScript(action, payload = {}) {
      let response;
      try {
        response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow',
          signal: AbortSignal.timeout(30000),
          body: JSON.stringify({ action, ...payload })
        });
      } catch (error) {
        if (error && (error.name === 'AbortError' || error.name === 'TimeoutError')) {
          throw new Error('Google Apps Script tidak merespons dalam 30 detik. Coba lagi beberapa saat.');
        }
        throw error;
      }
      const rawText = await response.text();
      let result;
      try {
        result = rawText ? JSON.parse(rawText) : null;
      } catch {
        throw new Error('Respons Google Apps Script tidak valid.');
      }
      if (!response.ok || !result || result.ok !== true) {
        throw new Error((result && result.error) || 'Permintaan ke Google Apps Script gagal.');
      }
      return result.data;
    }

    async function fallbackAppsScriptApi(url, options = {}) {
      const method = (options.method || 'GET').toUpperCase();
      const body = options.body ? JSON.parse(options.body) : {};
      const sessionHash = safeStorageGet(LOCAL_SESSION_KEY) || '';

      if (url === '/api/config' && method === 'GET') {
        return {
          googleClientId: state.googleClientId || GOOGLE_CLIENT_ID || null,
          googleEnabled: Boolean(state.googleClientId || GOOGLE_CLIENT_ID),
          googleClientIdIsDefault: (state.googleClientId || GOOGLE_CLIENT_ID) === '778021422214-3rchusoh5qaht0ufpn0qrqs81nk75h0t.apps.googleusercontent.com',
          translateEnabled: false,
          appsScriptUrl: GOOGLE_APPS_SCRIPT_URL || null
        };
      }

      if (url === '/api/health' && method === 'GET') {
        return { status: 'ok' };
      }

      if (url === '/api/translate' && method === 'POST') {
        const phrase = typeof body.phrase === 'string' ? body.phrase.trim() : '';
        if (!phrase || phrase.length > 300) {
          throw new Error('Frasa harus diisi dan maksimal 300 karakter.');
        }
        return analyzePhraseLocally(phrase);
      }

      if (url === '/api/auth/me' && method === 'GET') {
        if (!sessionHash) {
          const err = new Error('Sesi tidak ditemukan. Silakan masuk kembali.');
          err.status = 401;
          throw err;
        }
        const user = await callDirectAppsScript('findSessionUser', { sessionHash, now: Date.now() });
        if (!user) {
          safeStorageRemove(LOCAL_SESSION_KEY);
          const err = new Error('Sesi sudah berakhir. Silakan masuk kembali.');
          err.status = 401;
          throw err;
        }
        return { user: toClientPublicUser(user) };
      }

      if (url === '/api/auth/register' && method === 'POST') {
        const name = typeof body.name === 'string' ? body.name.trim() : '';
        const identity = normalizeClientIdentifier(body.identifier);
        const password = body.password;
        const education = body.education || 'SMA';
        if (!name || name.length > 80) throw new Error('Nama wajib diisi dan maksimal 80 karakter.');
        if (!identity) throw new Error('Masukkan email yang valid atau nomor HP yang valid.');
        if (typeof password !== 'string' || password.length < 8) {
          throw new Error('Kata sandi harus terdiri dari minimal 8 karakter.');
        }
        const existing = await callDirectAppsScript('findUserByIdentifier', { identity });
        if (existing) throw new Error('Email atau nomor HP sudah terdaftar.');

        const passHash = 'sha256$' + await sha256Hex(password);
        const created = await callDirectAppsScript('createUser', {
          user: {
            id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('usr-' + Date.now()),
            name,
            email: identity.email,
            phone: identity.phone,
            password_hash: passHash,
            education,
            level: 'Pemula',
            reminder_time: '19:00',
            mic_permission: 0,
            privacy_agreed: 0,
            parental_agreed: 0,
            onboarding_complete: 0,
            created_at: Date.now()
          }
        });
        const userRow = created && created.id ? created : {
          id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('usr-' + Date.now()),
          name,
          email: identity.email,
          phone: identity.phone,
          education,
          level: 'Pemula',
          reminder_time: '19:00'
        };
        const newSessionHash = await sha256Hex(userRow.id + '-' + Date.now() + '-' + Math.random());
        await callDirectAppsScript('createSession', {
          session: {
            session_hash: newSessionHash,
            user_id: userRow.id,
            expires_at: Date.now() + 7 * 24 * 60 * 60 * 1000
          },
          now: Date.now()
        });
        safeStorageSet(LOCAL_SESSION_KEY, newSessionHash);
        return { user: toClientPublicUser(userRow) };
      }

      if (url === '/api/auth/login' && method === 'POST') {
        const identity = normalizeClientIdentifier(body.identifier);
        if (!identity || typeof body.password !== 'string') {
          throw new Error('Email/nomor HP dan kata sandi wajib diisi.');
        }
        const user = await callDirectAppsScript('findUserByIdentifier', { identity });
        if (!user) throw new Error('Email/nomor HP atau kata sandi salah.');
        const storedHash = String(user.password_hash || '');
        if (storedHash === 'google-oauth') {
          throw new Error('Akun ini dibuat melalui Google. Silakan masuk dengan tombol "Masuk dengan Google".');
        }
        const candidateSha = 'sha256$' + await sha256Hex(body.password);
        if (storedHash.startsWith('sha256$') && storedHash !== candidateSha) {
          throw new Error('Email/nomor HP atau kata sandi salah.');
        }
        const newSessionHash = await sha256Hex(user.id + '-' + Date.now() + '-' + Math.random());
        await callDirectAppsScript('createSession', {
          session: {
            session_hash: newSessionHash,
            user_id: user.id,
            expires_at: Date.now() + 7 * 24 * 60 * 60 * 1000
          },
          now: Date.now()
        });
        safeStorageSet(LOCAL_SESSION_KEY, newSessionHash);
        return { user: toClientPublicUser(user) };
      }

      if (url === '/api/auth/google' && method === 'POST') {
        // Jalur offline (file:// / hosting statis): kredensial Google wajib ada
        // dan sudah lolos validasi klaim sebelum akun dibuat atau ditautkan.
        const credential = typeof body.credential === 'string' ? body.credential.trim() : '';
        if (!credential) {
          const err = new Error('Kredensial Google wajib ada. Masuk melalui tombol "Masuk dengan Google" pada versi online.');
          err.status = 401;
          throw err;
        }
        const claims = decodeGoogleCredential(credential);
        if (!claims || !validateGoogleClaims(claims)) {
          const err = new Error('Token Google tidak valid. Masuk melalui tombol "Masuk dengan Google".');
          err.status = 401;
          throw err;
        }

        const name = String(claims.name || claims.email).trim();
        const email = String(claims.email).toLowerCase();
        const googleSub = String(claims.sub || '');
        const education = ['SMA', 'SMK', 'SMP', 'Umum'].includes(body.education) ? body.education : 'SMA';
        if (!name || name.length > 80) throw new Error('Data akun Google tidak valid.');

        let user = null;
        try {
          user = await callDirectAppsScript('findUserByGoogleSub', { googleSub });
        } catch (err) {
          if (!err || !/Action tidak dikenal/i.test(err.message)) throw err;
        }
        if (!user) user = await callDirectAppsScript('findUserByIdentifier', { identity: { email, phone: null } });
        const isNewUser = !user;
        if (!user) {
          const newUserObj = {
            id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('usr-' + Date.now()),
            name,
            email,
            phone: null,
            password_hash: 'google-oauth',
            education,
            level: 'Pemula',
            reminder_time: '19:00',
            mic_permission: 0,
            privacy_agreed: 0,
            parental_agreed: 0,
            onboarding_complete: 0,
            streak: 0,
            new_words: 0,
            weekly_progress: 0,
            created_at: Date.now()
          };
          let created;
          try {
            created = await callDirectAppsScript('createUser', {
              user: {
                ...newUserObj,
                google_linked: 1,
                google_email: email,
                google_sub: googleSub || ('google-' + email)
              }
            });
          } catch {
            // Backend Apps Script lama mungkin belum punya kolom Google.
            created = await callDirectAppsScript('createUser', { user: newUserObj });
          }
          user = (created && created.id)
            ? { ...newUserObj, ...created, google_linked: 1, google_email: email }
            : { ...newUserObj, google_linked: 1, google_email: email };
        } else {
          const updates = {};
          if (!Number(user.google_linked)) updates.google_linked = 1;
          if ((user.google_email || '') !== email) updates.google_email = email;
          if (googleSub && (user.google_sub || '') !== googleSub) updates.google_sub = googleSub;
          if (Object.keys(updates).length > 0) {
            try {
              const updated = await callDirectAppsScript('updateUser', { id: user.id, updates });
              user = (updated && updated.id) ? { ...user, ...updated, ...updates } : { ...user, ...updates };
            } catch {
              // Login tetap lanjut walau penautan Google tidak tersimpan.
              user = { ...user, ...updates };
            }
          }
        }
        const newSessionHash = await sha256Hex(user.id + '-' + Date.now() + '-' + Math.random());
        await callDirectAppsScript('createSession', {
          session: {
            session_hash: newSessionHash,
            user_id: user.id,
            expires_at: Date.now() + 7 * 24 * 60 * 60 * 1000
          },
          now: Date.now()
        });
        safeStorageSet(LOCAL_SESSION_KEY, newSessionHash);
        return { user: toClientPublicUser(user), isNewUser };
      }

      if (url === '/api/auth/profile' && method === 'PUT') {
        if (!sessionHash) throw new Error('Sesi tidak ditemukan. Silakan masuk kembali.');
        const current = await callDirectAppsScript('findSessionUser', { sessionHash, now: Date.now() });
        if (!current) throw new Error('Sesi sudah berakhir. Silakan masuk kembali.');

        const updates = {};
        if (body.education) updates.education = body.education;
        if (body.level) updates.level = body.level;
        if (body.reminderTime) updates.reminder_time = body.reminderTime;
        if (typeof body.micPermission === 'boolean') updates.mic_permission = Number(body.micPermission);
        if (typeof body.privacyAgreed === 'boolean') updates.privacy_agreed = Number(body.privacyAgreed);
        if (typeof body.parentalAgreed === 'boolean') updates.parental_agreed = Number(body.parentalAgreed);
        if (typeof body.onboardingComplete === 'boolean') updates.onboarding_complete = Number(body.onboardingComplete);
        if (Number.isInteger(body.streak)) updates.streak = Math.max(0, Math.min(100000, body.streak));
        if (Number.isInteger(body.newWords)) updates.new_words = Math.max(0, Math.min(1000000, body.newWords));
        if (Number.isInteger(body.weeklyProgress)) updates.weekly_progress = Math.max(0, Math.min(100, body.weeklyProgress));

        const updated = await callDirectAppsScript('updateUser', { id: current.id, updates });
        return { user: toClientPublicUser(updated || { ...current, ...updates }) };
      }

      if (url === '/api/auth/forgot-password' && method === 'POST') {
        const identity = normalizeClientIdentifier(body.identifier);
        if (!identity) throw new Error('Masukkan email atau nomor HP yang valid.');
        const user = await callDirectAppsScript('findUserByIdentifier', { identity });
        const result = {
          success: true,
          message: 'Jika kontak terdaftar, tautan atur ulang kata sandi telah dikirim.'
        };
        if (user && user.email && window.crypto && window.crypto.getRandomValues) {
          const bytes = new Uint8Array(32);
          window.crypto.getRandomValues(bytes);
          const token = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
          const now = Date.now();
          try {
            await callDirectAppsScript('createPasswordReset', {
              reset: {
                token_hash: await sha256Hex(token),
                user_id: user.id,
                expires_at: now + 30 * 60 * 1000,
                created_at: now
              },
              now
            });
            result.resetUrl = `${window.location.origin}${window.location.pathname}?reset=${token}`;
          } catch (err) {
            if (!err || !/Action tidak dikenal/i.test(err.message)) throw err;
          }
        }
        return result;
      }

      if (url === '/api/auth/reset-password' && method === 'POST') {
        const token = typeof body.token === 'string' ? body.token.trim() : '';
        const password = body.password;
        if (!/^[a-f0-9]{64}$/.test(token)) {
          throw new Error('Tautan atur ulang tidak valid atau sudah kedaluwarsa.');
        }
        if (typeof password !== 'string' || password.length < 8) {
          throw new Error('Kata sandi harus terdiri dari minimal 8 karakter.');
        }
        const now = Date.now();
        const tokenHash = await sha256Hex(token);
        const reset = await callDirectAppsScript('findPasswordReset', { tokenHash, now });
        if (!reset) throw new Error('Tautan atur ulang tidak valid atau sudah kedaluwarsa.');
        const passHash = 'sha256$' + await sha256Hex(password);
        const updated = await callDirectAppsScript('updateUser', {
          id: reset.user_id,
          updates: { password_hash: passHash }
        });
        if (!updated) throw new Error('Akun untuk tautan ini tidak ditemukan.');
        await callDirectAppsScript('consumePasswordReset', { tokenHash, now });
        await callDirectAppsScript('deleteUserSessions', { userId: updated.id });
        return { success: true, message: 'Kata sandi berhasil diperbarui. Silakan masuk dengan kata sandi baru.' };
      }

      if (url === '/api/auth/google/unlink' && method === 'POST') {
        if (!sessionHash) throw new Error('Sesi tidak ditemukan. Silakan masuk kembali.');
        const current = await callDirectAppsScript('findSessionUser', { sessionHash, now: Date.now() });
        if (!current) throw new Error('Sesi sudah berakhir. Silakan masuk kembali.');
        if (!Number(current.google_linked)) throw new Error('Akun Google belum tertaut ke akun ini.');
        const updated = await callDirectAppsScript('updateUser', {
          id: current.id,
          updates: { google_linked: 0, google_email: '', google_sub: '' }
        });
        return { user: toClientPublicUser(updated || { ...current, google_linked: 0, google_email: null, google_sub: null }) };
      }

      if (url === '/api/auth/logout' && method === 'POST') {
        if (sessionHash) {
          await callDirectAppsScript('deleteSession', { sessionHash });
          safeStorageRemove(LOCAL_SESSION_KEY);
        }
        return { success: true };
      }

      throw new Error('Endpoint tidak ditemukan.');
    }

    async function apiRequest(url, options = {}) {
      if (window.location.protocol === 'file:') {
        return fallbackAppsScriptApi(url, options);
      }

      const headers = { ...(options.headers || {}) };
      if (options.body) headers['Content-Type'] = 'application/json';

      let response;
      try {
        response = await fetch(url, {
          ...options,
          headers,
          credentials: 'same-origin',
          signal: options.signal || AbortSignal.timeout(45000)
        });
      } catch (error) {
        if (error && (error.name === 'TimeoutError' || error.name === 'AbortError')) {
          throw new Error('Server terlalu lama merespons. Periksa koneksi lalu coba lagi.');
        }
        return fallbackAppsScriptApi(url, options);
      }

      const rawText = await response.text();
      let result = null;
      if (rawText && rawText.trim().length > 0) {
        try {
          result = JSON.parse(rawText);
        } catch {
          result = null;
        }
      }

      // Fallback hanya dipakai jika endpoint backend memang tidak ada
      // (hosting statis / Live Server). Error 5xx dari server asli tetap
      // ditampilkan apa adanya agar tidak menutupi masalah sebenarnya.
      const hasValidBackendJson = result && typeof result === 'object' && (
        response.ok || typeof result.error === 'string'
      );
      const backendMissing = response.status === 404 || response.status === 405 ||
        (!hasValidBackendJson && response.status < 400);
      if (backendMissing) {
        return fallbackAppsScriptApi(url, options);
      }

      if (!response.ok) {
        const error = new Error((result && result.error) || 'Permintaan ke server gagal.');
        error.status = response.status;
        throw error;
      }

      return result || {};
    }

    function getActiveTopics() {
      const level = state.user.level || 'Pemula';
      const baseList = state.topicsByLevel[level] || state.topicsByLevel.Pemula;
      const firstName = (state.user.name && state.user.name !== 'Pelajar')
        ? state.user.name.trim().split(/\s+/)[0]
        : 'Sania';
      return baseList.map(t => ({
        ...t,
        prompt: t.prompt.replace('{name}', firstName),
        promptMeaning: (t.promptMeaning || t.sampleMeaning).replace('{name}', firstName),
        promptPhonetic: (t.promptPhonetic || t.samplePhonetic).replace('{name}', firstName.toLowerCase())
      }));
    }

    function getCurrentTopic() {
      if (state.customPromptMode && state.customPromptText.trim()) {
        const custom = state.customPromptText.trim();
        return {
          title: 'Latihan Kalimat Sendiri',
          prompt: custom,
          promptMeaning: `Kalimat latihan kustom: "${custom}"`,
          promptPhonetic: 'Klik tombol Dengar untuk mendengarkan pelafalan langsung.',
          samplePhrase: custom,
          sampleMeaning: `Kalimat kustom: "${custom}"`,
          samplePhonetic: 'Gunakan tombol Cek di layar Terjemahan untuk analisis lengkap.',
          sampleExplanation: 'Mode kalimat kustom memungkinkan kamu berlatih teks pidato, presentasi, atau tugas sekolah sendiri.'
        };
      }
      const list = getActiveTopics();
      if (state.selectedTopicIndex >= list.length) state.selectedTopicIndex = 0;
      return list[state.selectedTopicIndex] || list[0];
    }

    function shuffleArray(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function randomizeQuizQuestion(raw) {
      const correctText = raw.options[raw.answer];
      const shuffledOptions = shuffleArray(raw.options);
      return {
        ...raw,
        options: shuffledOptions,
        answer: shuffledOptions.indexOf(correctText)
      };
    }

    function buildQuizSession(tier = state.quiz.selectedTier, shuffleOrder = state.quiz.shuffleQuestions) {
      const chosenTier = tier || state.user.level || 'Pemula';
      const pool = chosenTier === 'Semua'
        ? QUIZ_BANK_100
        : QUIZ_BANK_100.filter((item) => item.level === chosenTier);
      const ordered = shuffleOrder ? shuffleArray(pool) : pool;
      return ordered.map(randomizeQuizQuestion);
    }

    function getActiveQuizQuestions() {
      if (!Array.isArray(state.quiz.questions) || state.quiz.questions.length === 0) {
        state.quiz.questions = buildQuizSession(state.quiz.selectedTier || state.user.level || 'Pemula', state.quiz.shuffleQuestions);
      }
      return state.quiz.questions;
    }

    function loadQuizProgress() {
      const key = `speakup_quiz_progress_${state.user.id || 'guest'}`;
      try {
        const raw = safeStorageGet(key);
        const parsed = raw ? JSON.parse(raw) : null;
        if (parsed && Array.isArray(parsed.completedIds)) {
          state.quiz.completedIds = [...new Set(parsed.completedIds.map(Number).filter((n) => n >= 1 && n <= QUIZ_BANK_100.length))];
          state.quiz.bestCombo = Number(parsed.bestCombo) || 0;
        } else {
          state.quiz.completedIds = [];
          state.quiz.bestCombo = 0;
        }
      } catch {
        state.quiz.completedIds = [];
        state.quiz.bestCombo = 0;
      }
    }

    function saveQuizProgress() {
      const key = `speakup_quiz_progress_${state.user.id || 'guest'}`;
      safeStorageSet(key, JSON.stringify({
        completedIds: state.quiz.completedIds,
        bestCombo: state.quiz.bestCombo
      }));
    }

    function loadPracticeHistory() {
      if (!state.user.id) {
        state.practiceHistory = [];
        return;
      }
      try {
        const raw = safeStorageGet(`speakup_history_${state.user.id}`);
        const parsed = raw ? JSON.parse(raw) : [];
        state.practiceHistory = Array.isArray(parsed) ? parsed.slice(0, 12) : [];
      } catch {
        state.practiceHistory = [];
      }
    }

    function savePracticeHistoryEntry(entry) {
      if (!state.user.id) return;
      state.practiceHistory = [entry, ...state.practiceHistory].slice(0, 12);
      safeStorageSet(`speakup_history_${state.user.id}`, JSON.stringify(state.practiceHistory));
    }

    function applyAuthenticatedUser(user) {
      const next = user && typeof user === 'object' ? user : {};
      state.user = {
        ...state.user,
        ...next,
        email: next.email || next.phone || '',
        provider: next.provider || (next.googleLinked ? 'google' : 'email'),
        googleLinked: Boolean(next.googleLinked),
        googleEmail: next.googleEmail || '',
        streak: Number.isFinite(Number(next.streak)) ? Math.max(0, Math.trunc(Number(next.streak))) : 0,
        newWords: Number.isFinite(Number(next.newWords)) ? Math.max(0, Math.trunc(Number(next.newWords))) : 0,
        weeklyProgress: Number.isFinite(Number(next.weeklyProgress)) ? Math.max(0, Math.min(100, Math.trunc(Number(next.weeklyProgress)))) : 0,
        reminderTime: normalizeClientReminderTime(next.reminderTime || next.reminder_time || state.user.reminderTime)
      };
      state.accounts = [state.user];
      state.topics = getActiveTopics();
      state.quiz.selectedTier = state.user.level || 'Pemula';
      state.quiz.questions = buildQuizSession(state.quiz.selectedTier, state.quiz.shuffleQuestions);
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.combo = 0;
      state.quiz.answered = null;
      loadQuizProgress();
      loadVocabProgress();
      loadRoleplayProgress();
      loadPracticeHistory();
    }

    async function saveAuthenticatedProfile(overrides = {}) {
      const profile = {
        education: state.user.education,
        level: state.user.level,
        reminderTime: normalizeClientReminderTime(state.user.reminderTime),
        micPermission: state.user.micPermission,
        privacyAgreed: state.user.privacyAgreed,
        parentalAgreed: state.user.parentalAgreed,
        onboardingComplete: state.user.onboardingComplete,
        streak: state.user.streak,
        newWords: state.user.newWords,
        weeklyProgress: state.user.weeklyProgress,
        ...overrides
      };
      const result = await apiRequest('/api/auth/profile', {
        method: 'PUT',
        body: JSON.stringify(profile)
      });
      applyAuthenticatedUser(result.user);
    }

        showToast('Kata sandi dan ulangannya harus sama.', 'warning');
        return;
      }
      try {
        const result = await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token: state.resetToken, password })
        });
        showToast(result.message || 'Kata sandi berhasil diperbarui.', 'success');
        state.resetToken = '';
        if (window.history && window.history.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
        navigate('login');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function toggleConsent(field, val) {
      state.user[field] = val;
      render();

    async function handleMicCheckbox(checked) {
      if (checked) {
        await requestMicAccess();
      } else {
        state.user.micPermission = false;
        render();
      }
    }

    async function requestMicAccess() {
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        }
        state.user.micPermission = true;
        showToast('Akses mikrofon diizinkan!', 'success');
        render();
      } catch (err) {
        state.user.micPermission = false;
        showToast('Akses mikrofon ditolak. Kamu tetap bisa memakai demo hasil latihan.', 'warning');
        render();
      }
    }

        return;

        showToast(error.message, 'error');

                  <button onclick="setSpeechAccent('en-GB')" class="px-2 py-0.5 rounded-lg font-bold ${state.speechSettings.accent === 'en-GB' ? 'bg-mint-600 text-white' : 'bg-slate-100 text-slate-600'}">UK</button>

          ? '<div class="w-7 h-7 rounded-md bg-white"></div>'
          : '<svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>'
        }

            <span class="text-xs font-bold ${state.recording.isRecording ? 'text-rose-600' : 'text-slate-700'}">
