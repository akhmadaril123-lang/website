      quiz: {

        questions: [
          {

          },
          {

            options: ["in", "on", "at", "to"],
            answer: 2,
            info: "Gunakan 'at' sebelum nama institusi atau tempat spesifik."
          },
          {
            q: "Arti dari kalimat 'I speak with confidence' adalah...",
            options: ["Saya berbicara dengan cepat", "Saya berbicara dengan percaya diri", "Saya takut berbicara", "Saya belajar membaca"],

    };

    // =========================================================================
    // 2. HELPER UI, LOGO & SPEECH SYNTHESIS
    // =========================================================================
    function renderAppLogo(sizeClass = "w-20 h-20") {
      return `
        <div class="${sizeClass} rounded-3xl bg-gradient-to-br from-brand-500 to-mint-500 p-3.5 shadow-lg shadow-brand-500/25 flex items-center justify-center relative">
          <svg viewBox="0 0 64 64" class="w-full h-full text-white" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 16C12 11.5817 15.5817 8 20 8H44C48.4183 8 52 11.5817 52 16V38C52 42.4183 48.4183 46 44 46H26L14 55V46H20C15.5817 46 12 42.4183 12 38V16Z" fill="white" fill-opacity="0.18" stroke="white" stroke-width="3.2" stroke-linejoin="round"/>
            <circle cx="21" cy="31" r="2.8" fill="white"/>
            <rect x="27" y="24" width="4.5" height="10" rx="2.25" fill="white"/>
            <rect x="34.5" y="19" width="4.5" height="15" rx="2.25" fill="white"/>
            <path d="M44.5 14L49.5 19.5H46.5V34H42.5V19.5H39.5L44.5 14Z" fill="#A7F3D0"/>
          </svg>
        </div>
      `;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'bg-slate-900 text-white',
        success: 'bg-mint-600 text-white',
        warning: 'bg-amber-500 text-white',
        error: 'bg-rose-600 text-white'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-2xl text-xs font-medium shadow-lg flex items-center gap-2 screen-enter ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    function speakEnglish(text) {
      if (!('speechSynthesis' in window)) {
        showToast('Browser tidak mendukung pemutar suara otomatis.', 'warning');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
      showToast('Memutar pengucapan bahasa Inggris...', 'info');
    }

    // =========================================================================
    // 2B. GOOGLE ACCOUNT PICKER & LINKING FLOW
    // =========================================================================
    function openGoogleAccountModal(mode = 'signin') {
      state.googleModal.isOpen = true;
      state.googleModal.step = 'picker';
      state.googleModal.selectedCandidate = null;
      state.googleModal.statusMessage = '';
      renderGoogleModal();
    }

    let googleIdentityServicesPromise;

    function loadGoogleIdentityServices() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        return Promise.resolve();
      }
      if (googleIdentityServicesPromise) return googleIdentityServicesPromise;

      googleIdentityServicesPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.async = true;
        script.onload = () => {
          if (window.google && window.google.accounts && window.google.accounts.id) {
            resolve();
          } else {
            reject(new Error('Google Identity Services tidak tersedia.'));
          }
        };
        script.onerror = () => reject(new Error('Gagal memuat Google Identity Services.'));
        document.head.appendChild(script);
      });

      return googleIdentityServicesPromise;
    }

    async function renderGISButton() {
      const container = document.getElementById('google-gis-button');
      const clientId = state.googleClientId;
      if (!container || !clientId) return;

      try {
        await loadGoogleIdentityServices();
        if (!container.isConnected || clientId !== state.googleClientId) return;

        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: handleGoogleCredential
        });
        window.google.accounts.id.renderButton(container, {
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'pill',
          width: 320
        });
      } catch (error) {
        googleIdentityServicesPromise = null;
        console.error('Google Identity Services gagal dimuat:', error);
        showToast('Tidak dapat memuat tombol Google. Periksa koneksi lalu coba lagi.', 'error');
      }
    }

    function handleGoogleCredential(response) {
      if (!response || typeof response.credential !== 'string') {
        showToast('Google tidak mengirim kredensial yang valid.', 'error');
        return;
      }

      let claims;
      try {
        const payload = response.credential.split('.')[1];
        if (!payload) throw new Error('Token Google tidak memiliki payload.');
        const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
        const paddedBase64 = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
        const payloadBytes = Uint8Array.from(atob(paddedBase64), char => char.charCodeAt(0));
        claims = JSON.parse(new TextDecoder().decode(payloadBytes));
      } catch (error) {
        console.error('Kredensial Google tidak dapat dibaca:', error);
        showToast('Respons Google tidak valid. Silakan coba lagi.', 'error');
        return;
      }

      if (!claims || typeof claims !== 'object') {
        showToast('Respons Google tidak valid. Silakan coba lagi.', 'error');
        return;
      }

      const validAudience = claims.aud === state.googleClientId ||
        (Array.isArray(claims.aud) && claims.aud.includes(state.googleClientId));
      const validIssuer = claims.iss === 'https://accounts.google.com' ||
        claims.iss === 'accounts.google.com';
      if (!validAudience || !validIssuer || !Number.isFinite(claims.exp) ||
          claims.exp <= Date.now() / 1000 ||
          claims.email_verified !== true || !claims.sub || !claims.email || !claims.name) {
        showToast('Identitas Google tidak lengkap atau tidak sesuai Client ID ini.', 'error');
        return;
      }

      const candidate = {
        name: claims.name,
        email: claims.email.toLowerCase(),
        googleSub: claims.sub,
        avatarColor: 'from-emerald-500 to-teal-600'
      };
      selectGoogleCandidate(candidate);
    }

    function closeGoogleAccountModal() {
      state.googleModal.isOpen = false;
      state.googleModal.step = 'picker';
      renderGoogleModal();
    }

    function findLinkedAccountByGoogle(candidate) {
      return state.accounts.find(
        acc =>
          (candidate.googleSub && acc.googleSub === candidate.googleSub) ||
          acc.email.toLowerCase() === candidate.email.toLowerCase() ||
          (acc.googleEmail && acc.googleEmail.toLowerCase() === candidate.email.toLowerCase())
      );
    }

    function selectGoogleCandidate(candidate) {
      state.googleModal.selectedCandidate = candidate;
      const existingAccount = findLinkedAccountByGoogle(candidate);

      if (existingAccount && existingAccount.googleLinked) {
        // Akun Google sudah tertaut ke akun SpeakUp
        existingAccount.name = existingAccount.name || candidate.name;
        existingAccount.provider = 'google';
        existingAccount.googleEmail = candidate.email;
        existingAccount.googleSub = candidate.googleSub;

        state.user = { ...existingAccount };
        state.googleModal.step = 'linking-existing';
        state.googleModal.statusMessage = `Menautkan sesi & memverifikasi akun Google (${candidate.email})...`;
        renderGoogleModal();
        render();

        setTimeout(() => {
          if (!state.googleModal.isOpen) return;
          closeGoogleAccountModal();
          showToast(`Akun Google terhubung • Selamat datang, ${state.user.name}!`, 'success');
          navigate('home');
        }, 900);
      } else {
        // Akun Google BARU: buat profil SpeakUp & tautkan identitas Google terlebih dahulu
        state.googleModal.step = 'link-new';
        state.googleModal.pendingName = candidate.name;
        state.googleModal.pendingEmail = candidate.email;
        state.googleModal.pendingEducation = 'SMA';
        state.googleModal.pendingGoogleSub = candidate.googleSub;
        renderGoogleModal();
      }
    }

    function setPendingGoogleEducation(edu) {
      state.googleModal.pendingEducation = edu;
      renderGoogleModal();
    }

    function confirmCreateAndLinkGoogleAccount(e) {
      e.preventDefault();
      const fullName = document.getElementById('google-link-name').value.trim();
      const email = state.googleModal.pendingEmail;
      const edu = state.googleModal.pendingEducation || 'SMA';
      const sub = state.googleModal.pendingGoogleSub || ('google-oauth2|' + Date.now());

      if (!fullName) {
        showToast('Nama lengkap wajib diisi untuk membuat akun SpeakUp.', 'warning');
        return;
      }

      const newAccount = {
        id: 'acc-' + Date.now(),
        name: fullName,
        email: email,
        provider: 'google',
        googleLinked: true,
        googleEmail: email,
        googleSub: sub,
        education: edu,
        level: 'Pemula',
        streak: 1,
        newWords: 0,
        weeklyProgress: 15,
        reminderTime: '19:00',
        micPermission: false,
        privacyAgreed: false,
        parentalAgreed: false
      };

      // Simpan atau perbarui di daftar akun
      const idx = state.accounts.findIndex(a => a.email.toLowerCase() === email.toLowerCase());
      if (idx >= 0) {
        state.accounts[idx] = { ...state.accounts[idx], ...newAccount };
      } else {
        state.accounts.push(newAccount);
      }

      state.user = { ...newAccount };
      closeGoogleAccountModal();
      showToast(`Akun SpeakUp dibuat & ditautkan ke ${email}. Lengkapi persetujuan & level!`, 'success');
      navigate('consent');
    }

    function unlinkGoogleAccount() {
      state.user.googleLinked = false;
      state.user.provider = 'email';
      const prevGoogleEmail = state.user.googleEmail || state.user.email;
      state.user.googleEmail = '';

      const idx = state.accounts.findIndex(a => a.id === state.user.id || a.email === state.user.email);
      if (idx >= 0) {
        state.accounts[idx].googleLinked = false;
        state.accounts[idx].provider = 'email';
        state.accounts[idx].googleEmail = '';
      }

      showToast(`Tautan akun Google (${prevGoogleEmail}) dilepas.`, 'info');
      render();
    }

    function renderGoogleModal() {
      const modal = document.getElementById('google-modal');
      const card = document.getElementById('google-modal-card');
      if (!modal || !card) return;

      if (!state.googleModal.isOpen) {
        modal.classList.add('hidden');
        return;
      }

      modal.classList.remove('hidden');

      if (state.googleModal.step === 'linking-existing') {
        const c = state.googleModal.selectedCandidate;
        card.innerHTML = `
          <div class="py-5 text-center space-y-3">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-mint-50 border border-mint-200 flex items-center justify-center">
              <div class="w-7 h-7 border-3 border-brand-600 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-mint-100 text-mint-700 text-xs font-bold">
              ✓ Akun Google terhubung
            </span>
            <h3 class="font-display text-lg font-extrabold text-slate-900">${c.name}</h3>
            <p class="text-xs text-slate-500">${c.email}</p>
            <p class="text-xs font-medium text-brand-600 pt-1">${state.googleModal.statusMessage}</p>
          </div>
        `;
        return;
      }

      if (state.googleModal.step === 'link-new') {
        const c = state.googleModal.selectedCandidate;
        const jenjangList = ['SMA', 'SMK', 'SMP', 'Umum'];
        card.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <button onclick="state.googleModal.step='picker'; renderGoogleModal();" class="text-xs font-bold text-slate-500 hover:text-slate-800">
                ← Ganti Akun Google
              </button>
              <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">
                Akun Google Baru
              </span>
            </div>

            <div class="p-3.5 rounded-2xl bg-brand-50/70 border border-brand-200 flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-gradient-to-br ${c.avatarColor} text-white font-display font-extrabold flex items-center justify-center text-base shrink-0">
                ${c.name.charAt(0).toUpperCase()}
              </div>

    function navigate(screen) {

    function updateBottomNav() {
      const nav = document.getElementById('bottom-nav');
      const mainScreens = ['home', 'practice', 'result', 'translate', 'quiz', 'profile'];
      if (mainScreens.includes(state.currentScreen)) {
        nav.classList.remove('hidden');
      } else {
        nav.classList.add('hidden');
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        const isActive =
          target === state.currentScreen ||
          (target === 'practice' && state.currentScreen === 'result') ||
          (target === 'home' && state.currentScreen === 'translate');

        if (isActive) {
          btn.classList.add('text-brand-600', 'bg-brand-50', 'font-semibold');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('text-brand-600', 'bg-brand-50', 'font-semibold');
          btn.classList.add('text-slate-400');
        }
      });
    }

    // =========================================================================

    async function apiRequest(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body) headers['Content-Type'] = 'application/json';
      const response = await fetch(url, {
        ...options,
        headers,
        credentials: 'same-origin'
      });
      const result = await response.json();
      if (!response.ok) {
        const error = new Error(result.error || 'Permintaan ke server gagal.');
        error.status = response.status;
        throw error;
      }
      return result;
    }

    function applyAuthenticatedUser(user) {
      state.user = {
        ...state.user,
        ...user,
        email: user.email || user.phone || '',
        provider: 'email',
        googleLinked: false,
        googleEmail: ''
      };
      state.accounts = [state.user];
    }

    async function saveAuthenticatedProfile(overrides = {}) {
      const profile = {
        education: state.user.education,
        level: state.user.level,
        reminderTime: state.user.reminderTime,
        micPermission: state.user.micPermission,
        privacyAgreed: state.user.privacyAgreed,
        parentalAgreed: state.user.parentalAgreed,
        onboardingComplete: state.user.onboardingComplete,
        ...overrides
      };
      const result = await apiRequest('/api/auth/profile', {
        method: 'PUT',
        body: JSON.stringify(profile)
      });
      applyAuthenticatedUser(result.user);
    }

    function toggleRecording() {
      if (state.recording.isRecording) {
        stopRecording(false);
      } else {
        startRecording();
      }
    }

    function startRecording() {
      state.recording.isRecording = true;
      state.recording.seconds = 0;
      let capturedSpeech = '';

      // Coba gunakan Web Speech API jika tersedia di browser
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'en-US';
          recognition.interimResults = true;
          recognition.continuous = true;
          recognition.onresult = (event) => {
            let finalStr = '';
            for (let i = 0; i < event.results.length; i++) {
              finalStr += event.results[i][0].transcript + ' ';
            }
            capturedSpeech = finalStr.trim();
            state.recording._liveSpeech = capturedSpeech;
          };
          recognition.onerror = () => {};
          recognition.start();
          state.recording.recognition = recognition;
        } catch (e) {}
      }

      state.recording._liveSpeech = '';
      state.recording.timerInterval = setInterval(() => {
        state.recording.seconds += 1;
        const timerEl = document.getElementById('recording-timer');
        if (timerEl) {
          const m = String(Math.floor(state.recording.seconds / 60)).padStart(2, '0');
          const s = String(state.recording.seconds % 60).padStart(2, '0');
          timerEl.textContent = `${m} : ${s}`;
        }
      }, 1000);

      render();
    }

    function stopRecording(cancelled = false) {
      state.recording.isRecording = false;
      clearInterval(state.recording.timerInterval);
      if (state.recording.recognition) {
        try { state.recording.recognition.stop(); } catch (e) {}
        state.recording.recognition = null;
      }

      if (cancelled) return;

      const spoken = (state.recording._liveSpeech || '').trim();
      if (spoken.length > 2) {
        evaluateSpokenText(spoken);
      } else {
        // Jika tidak ada input suara mic (misal tes di desktop tanpa mic), gunakan skenario koreksi Sania dari sketsa
        runSimulatedResult();
      }
    }

    function evaluateSpokenText(spoken) {
      const topic = state.topics[state.selectedTopicIndex];
      const targetWords = topic.prompt.split(/\s+/);
      const spokenClean = spoken.toLowerCase().replace(/[.,!?]/g, '').split(/\s+/);

      let matchedCount = 0;
      let firstMistake = null;

      const analyzed = targetWords.map(w => {
        const cleanTarget = w.toLowerCase().replace(/[.,!?]/g, '');
        const found = spokenClean.includes(cleanTarget);
        if (found) {
          matchedCount++;
          return { text: w, error: false };
        } else {
          if (!firstMistake) firstMistake = cleanTarget;
          return { text: w, error: true, expected: cleanTarget };
        }
      });

      const ratio = matchedCount / targetWords.length;
      const pronun = Math.max(68, Math.min(98, Math.round(ratio * 100)));
      const gram = Math.max(80, Math.min(98, pronun + 10));
      const total = Math.round((pronun + gram) / 2);

      state.recording.transcriptWords = analyzed;
      state.recording.totalScore = total;
      state.recording.grammarScore = gram;
      state.recording.pronunciationScore = pronun;
      state.recording.feedback = firstMistake
        ? `Hampir tepat! Perhatikan pelafalan kata '${firstMistake}' agar lebih jelas.`
        : 'Luar biasa! Pengucapan dan struktur kalimatmu sudah sangat tepat.';

      markSessionProgress();
      navigate('result');
    }

    function runSimulatedResult() {
      // Skenario persis seperti sketsa wireframe halaman 3 ("Hasil latihan")
      if (state.selectedTopicIndex === 0) {
        state.recording.transcriptWords = [
          { text: 'My', error: false },
          { text: 'name', error: false },
          { text: 'is', error: false },
          { text: 'Sania,', error: false },
          { text: 'and', error: false },
          { text: 'I', error: false },
          { text: 'studi', error: true, expected: 'study' },
          { text: 'at', error: false },
          { text: 'SMAN', error: false },
          { text: '1', error: false },
          { text: 'Kejayan', error: false }
        ];
        state.recording.totalScore = 82;
        state.recording.grammarScore = 90;
        state.recording.pronunciationScore = 75;
        state.recording.feedback = "Hampir tepat! Ucapkan study seperti *stadi*";
      } else {
        const topic = state.topics[state.selectedTopicIndex];

    async function analyzeCustomPhrase() {
      const inputEl = document.getElementById('translate-input');
      const phrase = inputEl ? inputEl.value.trim() : '';
      if (!phrase) return;

      state.translation.inputText = phrase;

      // Cek contoh bawaan sketsa
      if (phrase.toLowerCase() === 'i study at school') {
        state.translation.meaning = 'Aku belajar di sekolah';
        state.translation.phonetic = 'ai stadi at skul';
        state.translation.explanation = 'Study dipakai untuk kegiatan belajar. Pakai at sebelum nama tempat.';
        render();
        return;
      }

      // Gunakan Gemini API untuk frasa kustom siswa
      state.translation.isLoading = true;
      render();

      try {
        const prompt = `Analisis kalimat bahasa Inggris berikut untuk pelajar SMA di Indonesia: "${phrase}".
Berikan respons JSON dengan kunci:
- meaning: terjemahan bahasa Indonesia yang alami
- phonetic: cara baca fonetik sederhana ejaan Indonesia (contoh: "ai stadi at skul")
- explanation: penjelasan tata bahasa singkat (maksimal 2 kalimat bahasa Indonesia)`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  meaning: { type: 'STRING' },
                  phonetic: { type: 'STRING' },
                  explanation: { type: 'STRING' }
                },
                required: ['meaning', 'phonetic', 'explanation']
              }
            }
          })
        });

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (rawText) {
          const parsed = JSON.parse(rawText);
          state.translation.meaning = parsed.meaning;
          state.translation.phonetic = parsed.phonetic;
          state.translation.explanation = parsed.explanation;
          state.user.newWords += 1;
        } else {
          throw new Error('Empty AI response');
        }
      } catch (err) {
        state.translation.meaning = `Terjemahan untuk "${phrase}"`;
        state.translation.phonetic = phrase.toLowerCase();
        state.translation.explanation = 'Perhatikan jeda antar kata dan tekanan pada suku kata utama saat mengucapkan kalimat ini.';
      } finally {
        state.translation.isLoading = false;
        render();
      }
    }

                class="px-2.5 py-1 rounded-xl bg-white border border-brand-200 text-xs font-bold text-brand-700" />
            </div>
          </div>

          <!-- Tombol Selesai & Keluar -->
          <div class="pt-6 pb-2 space-y-2.5">
            <button onclick="navigate('goodbye')" class="w-full py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-600/25 transition-all">
              Selesai
            </button>
            <button onclick="navigate('home')" class="w-full py-2.5 rounded-2xl text-xs font-semibold text-slate-500 hover:text-brand-600">
              Kembali ke Beranda
            </button>
          </div>
        </div>
      `;
    }

    function renderGoodbyeScreen() {
      return `
        <div class="screen-enter min-h-full flex flex-col items-center justify-between p-8 bg-gradient-to-b from-brand-600 to-brand-800 text-white text-center">
          <div class="pt-6">
            <span class="px-3 py-1 rounded-full bg-white/15 text-xs font-semibold">
              Pengingat aktif pukul ${state.user.reminderTime}
            </span>
          </div>

          <div class="flex flex-col items-center my-auto">
            ${renderAppLogo("w-24 h-24 mb-6")}
            <h1 class="font-display text-3xl font-extrabold tracking-tight">
              Speak up..
            </h1>
            <p class="text-sm text-brand-100 mt-2 max-w-[240px] leading-relaxed">
              Terima kasih sudah berani bicara hari ini, ${state.user.name}. Sampai jumpa besok!
            </p>
          </div>

          <div class="w-full pb-4">
            <button onclick="navigate('splash')" class="w-full py-3.5 rounded-2xl bg-white/15 hover:bg-white/25 backdrop-blur text-white font-bold text-sm border border-white/20 transition-all">
              Buka Aplikasi Lagi
            </button>
          </div>
        </div>
      `;
    }

    // Inisialisasi aplikasi saat halaman dimuat
    window.addEventListener('DOMContentLoaded', async () => {
      let startupError = '';
      try {
        const result = await apiRequest('/api/auth/me');
        applyAuthenticatedUser(result.user);
        state.currentScreen = state.user.onboardingComplete ? 'home' : state.user.privacyAgreed ? 'level' : 'consent';
      } catch (error) {
        if (error.status !== 401) startupError = error.message;
      }
      render();
      renderGoogleModal();
      if (startupError) showToast(startupError, 'error');
    });
  </script>
</body>
</html>
