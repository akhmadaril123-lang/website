    function toggleRecording() {
      if (state.recording.isRecording) {
        stopRecording(false);
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      if (state.recording.isStarting) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Browser tidak mendukung pengenalan suara langsung. Gunakan Chrome/Edge atau mode contoh.', 'warning');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Mikrofon tidak bisa diakses. Buka situs melalui HTTPS dan izinkan akses mikrofon di pengaturan browser.', 'error');
        return;
      }

      state.recording.isStarting = true;
      let micStream;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (error) {
        state.recording.isStarting = false;
        const errorName = error && error.name;
        if (errorName === 'NotAllowedError' || errorName === 'PermissionDeniedError') {
          showToast('Izin mikrofon belum diberikan. Ketuk Izinkan saat diminta, atau aktifkan Mikrofon di pengaturan situs browser.', 'error');
        } else if (errorName === 'NotFoundError' || errorName === 'DevicesNotFoundError') {
          showToast('Mikrofon tidak ditemukan. Periksa apakah mikrofon perangkat tersedia dan aktif.', 'error');
        } else if (errorName === 'NotReadableError' || errorName === 'TrackStartError') {
          showToast('Mikrofon sedang digunakan aplikasi lain atau tidak dapat dinyalakan. Tutup aplikasi lain yang memakai mikrofon lalu coba lagi.', 'error');
        } else {
          showToast('Mikrofon tidak bisa diakses. Periksa izin mikrofon browser dan pengaturan perangkat.', 'error');
        }
        return;
      }
      state.recording.isStarting = false;
      micStream.getTracks().forEach(track => track.stop());

      state.recording.isRecording = true;
      state.recording.seconds = 0;
      state.recording.stopRequested = false;
      state.recording.evaluationLock = false;
      clearTimeout(state.recording.finalizingTimer);
      state.recording._liveSpeech = '';

      if (SpeechRecognition) {
        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'en-US';
          recognition.interimResults = true;
          recognition.continuous = true;
          recognition.onresult = (event) => {
            let finalStr = '';
            for (let i = 0; i < event.results.length; i++) {
              finalStr += event.results[i][0].transcript + ' ';
            }
            state.recording._liveSpeech = finalStr.trim();
            const liveBox = document.getElementById('live-transcript-box');
            if (liveBox && state.recording._liveSpeech) {
              liveBox.textContent = state.recording._liveSpeech;
            }
          };
          recognition.onerror = (event) => {
            const errorMessages = {
              'not-allowed': 'Izin mikrofon ditolak. Izinkan mikrofon untuk situs ini di pengaturan browser.',
              'service-not-allowed': 'Layanan pengenalan suara browser tidak diizinkan. Coba gunakan Chrome terbaru.',
              'audio-capture': 'Mikrofon tidak tersedia atau sedang digunakan aplikasi lain.',
              network: 'Pengenalan suara memerlukan koneksi internet. Periksa koneksi lalu coba lagi.',
              'language-not-supported': 'Bahasa pengenalan suara tidak tersedia di browser ini.'
            };
            const message = event && errorMessages[event.error];
            if (message) {
              state.recording.isRecording = false;
              state.recording.stopRequested = false;
              state.recording.recognition = null;
              clearInterval(state.recording.timerInterval);
              showToast(message, 'error');
              render();
            }
          };
          recognition.onend = () => {
            if (state.recording.isRecording && !state.recording.stopRequested) {
              try { recognition.start(); } catch { }
              return;
            }
            finishRecordingEvaluation();
          };
          recognition.start();
          state.recording.recognition = recognition;
        } catch (error) {
          state.recording.isRecording = false;
          state.recording.stopRequested = false;
          showToast(error && error.name === 'NotAllowedError'
            ? 'Izin mikrofon ditolak. Izinkan mikrofon untuk situs ini di pengaturan browser.'
            : 'Browser gagal memulai pengenalan suara. Coba muat ulang halaman atau gunakan Chrome terbaru.',
          'error');
          render();
          return;
        }
      }

      state.recording.timerInterval = setInterval(() => {
        state.recording.seconds += 1;
        const timerEl = document.getElementById('recording-timer');
        if (timerEl) {
          const m = String(Math.floor(state.recording.seconds / 60)).padStart(2, '0');
          const s = String(state.recording.seconds % 60).padStart(2, '0');
          timerEl.textContent = `${m} : ${s}`;
        }
      }, 1000);

      render();
    }

    function stopRecording(cancelled = false) {
      state.recording.isRecording = false;
      clearInterval(state.recording.timerInterval);

      if (cancelled) {
        state.recording.stopRequested = true;
        clearTimeout(state.recording.finalizingTimer);
        if (state.recording.recognition) {
          try { state.recording.recognition.stop(); } catch { }
          state.recording.recognition = null;
        }
        return;
      }

      state.recording.stopRequested = true;
      if (state.recording.recognition) {
        try { state.recording.recognition.stop(); } catch { }
        state.recording.recognition = null;
      }
      render();
      clearTimeout(state.recording.finalizingTimer);
      state.recording.finalizingTimer = setTimeout(finishRecordingEvaluation, 900);
    }

    function finishRecordingEvaluation() {
      if (!state.recording.stopRequested || state.recording.evaluationLock) return;
      state.recording.evaluationLock = true;
      clearTimeout(state.recording.finalizingTimer);

      const spoken = (state.recording._liveSpeech || '').trim();
      if (spoken.length > 0) {
        evaluateSpokenText(spoken, Math.max(1, state.recording.seconds));
        return;
      }

      state.recording.evaluationLock = false;
      showToast('Suara tidak terdeteksi. Pastikan mikrofon aktif dan ucapkan kalimat dengan jelas.', 'warning');
      render();
    }

    // Levenshtein distance untuk mengukur kemiripan pelafalan per kata secara akurat
    function wordSimilarity(a, b) {
      if (a === b) return 1;
      if (!a || !b) return 0;
      const m = a.length;
      const n = b.length;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return 1 - dp[m][n] / Math.max(m, n);
    }

    function evaluateSpokenText(spoken, durationSeconds = 5) {
      const topic = getCurrentTopic();
      const targetText = state.customPromptMode
        ? (state.customPromptText || '').trim()
        : topic.prompt;
      const targetWords = (targetText || topic.prompt).split(/\s+/).filter(Boolean);
      const spokenTokens = spoken.toLowerCase().replace(/[^a-z0-9'\s]/g, '').split(/\s+/).filter(Boolean);

      // Penilaian ketat per kata (1-to-1 matching + urutan + Levenshtein, tanpa skor bonus palsu)
      let exactMatches = 0;
      let similaritySum = 0;
      let orderMatches = 0;
      let lastMatchedIdx = -1;
      const usedSpoken = new Set();
      const mistakes = [];

      const analyzed = targetWords.map((rawWord) => {
        const cleanTarget = rawWord.toLowerCase().replace(/[^a-z0-9']/g, '');
        let bestSim = 0;
        let bestIdx = -1;

        for (let i = 0; i < spokenTokens.length; i++) {
          if (usedSpoken.has(i)) continue;
          const sim = wordSimilarity(cleanTarget, spokenTokens[i]);
          if (sim > bestSim || (sim === bestSim && sim > 0 && bestIdx !== -1 && i > lastMatchedIdx && bestIdx <= lastMatchedIdx)) {
            bestSim = sim;
            bestIdx = i;
          }
        }

        const isShortWord = cleanTarget.length <= 2;
        const isExact = isShortWord ? bestSim === 1 : bestSim >= 0.85;
        const isPartial = !isShortWord && bestSim >= 0.65 && bestSim < 0.85;

        if (isExact && bestIdx !== -1) {
          usedSpoken.add(bestIdx);
          exactMatches += 1;
          similaritySum += 1;
          if (bestIdx > lastMatchedIdx) {
            orderMatches += 1;
            lastMatchedIdx = bestIdx;
          }
          return { text: rawWord, error: false, status: 'correct' };
        }
        if (isPartial && bestIdx !== -1) {
          usedSpoken.add(bestIdx);
          similaritySum += bestSim * 0.6;
          mistakes.push({ expected: cleanTarget, heard: spokenTokens[bestIdx] || '' });
          return { text: rawWord, error: true, status: 'partial', expected: cleanTarget, heard: spokenTokens[bestIdx] || '' };
        }
        mistakes.push({ expected: cleanTarget, heard: '' });
        return { text: rawWord, error: true, status: 'missed', expected: cleanTarget, heard: '' };
      });

      const wordCount = Math.max(1, targetWords.length);
      const recall = similaritySum / wordCount;
      const precision = spokenTokens.length > 0 ? Math.min(1, similaritySum / spokenTokens.length) : 0;
      const accuracy = (recall + precision) > 0 ? (2 * recall * precision) / (recall + precision) : 0;
      const orderRatio = orderMatches / wordCount;
      const exactRatio = exactMatches / wordCount;

      // Skor nyata 0 - 100: jika salah semua (similaritySum === 0), semua sub-skor & total = 0
      const pronun = similaritySum === 0 ? 0 : Math.max(0, Math.min(100, Math.round(accuracy * 100)));
      const gram = similaritySum === 0
        ? 0
        : Math.max(0, Math.min(100, Math.round(((orderRatio * 0.7) + (exactRatio * 0.3)) * Math.min(1, precision + 0.15) * 100)));

      // Kecepatan bicara (WPM) & kelancaran dikalikan akurasi agar kalimat salah tidak mendapat skor kelancaran tinggi
      const wpm = Math.round((spokenTokens.length / Math.max(1, durationSeconds)) * 60);
      let paceScore = 0;
      if (spokenTokens.length > 0 && similaritySum > 0) {
        if (wpm >= 85 && wpm <= 160) {
          paceScore = 100;
        } else if (wpm < 85) {
          paceScore = Math.max(25, Math.round((wpm / 85) * 100));
        } else {
          paceScore = Math.max(40, Math.round((160 / wpm) * 100));
        }
      }
      const fluency = similaritySum === 0 ? 0 : Math.max(0, Math.min(100, Math.round(paceScore * accuracy)));

      const total = similaritySum === 0 ? 0 : Math.round((pronun * 0.5) + (gram * 0.3) + (fluency * 0.2));

      const tips = [];
      if (mistakes.length > 0) {
        const sample = mistakes.slice(0, 3).map(m => m.expected);
        tips.push(`Latih ulang pelafalan kata: ${sample.join(', ')}.`);
      }
      if (similaritySum === 0) {
        tips.push('Tidak ada kata yang cocok dengan kalimat target. Tekan tombol "Dengar" lalu ikuti kalimat bahasa Inggris di atas.');
      } else if (wpm > 0 && wpm < 70) {
        tips.push('Coba ucapkan kalimat lebih mengalir tanpa jeda terlalu lama antar kata.');
      } else if (wpm > 165) {
        tips.push('Temponya sedikit terlalu cepat, perlambat sedikit agar artikulasi lebih jelas.');
      }
      if (exactMatches === wordCount && spokenTokens.length <= wordCount + 2) {
        tips.push('Semua kata terucap tepat! Kamu siap mencoba topik atau level berikutnya.');
      }

      let feedback = '';
      if (total >= 90) {
        feedback = 'Luar biasa! Pengucapan, tata bahasa, dan kelancaranmu sangat jelas.';
      } else if (total >= 75) {
        feedback = mistakes[0]
          ? `Bagus! Hampir sempurna, perjelas pelafalan kata "${mistakes[0].expected}".`
          : 'Bagus! Pertahankan intonasi dan ritme bicaramu.';
      } else if (total >= 50) {
        feedback = mistakes[0]
          ? `Cukup baik! Masih ada beberapa kata yang kurang tepat seperti "${mistakes[0].expected}". Dengarkan contoh lalu ulangi.`
          : 'Cukup baik! Ulangi pelan-pelan agar setiap kata terdengar jelas.';
      } else if (total > 0) {
        feedback = 'Masih banyak kata yang meleset. Dengarkan tombol "Dengar" terlebih dahulu lalu ikuti kalimatnya perlahan.';
      } else {
        feedback = 'Belum ada kata yang sesuai dengan kalimat latihan. Dengarkan contoh audio lalu coba ucapkan lagi.';
      }

      state.recording.spokenRaw = spoken;
      state.recording.transcriptWords = analyzed;
      state.recording.totalScore = total;
      state.recording.grammarScore = gram;
      state.recording.pronunciationScore = pronun;
      state.recording.fluencyScore = fluency;
      state.recording.wpm = wpm;
      state.recording.feedback = feedback;
      state.recording.tips = tips;

      markSessionProgress(topic.title, total, wpm, exactMatches);
      navigate('result');
    }

    function runSimulatedResult() {
      const topic = getCurrentTopic();
      const words = topic.prompt.split(/\s+/);
      // Simulasi contoh dengan 1 kesalahan kata untuk pratinjau tanpa mikrofon
      const simulatedSpoken = words.filter((_, idx) => idx !== Math.min(2, words.length - 1)).join(' ');
      evaluateSpokenText(simulatedSpoken, Math.max(4, Math.round(words.length / 2)));
    }

    let progressSaveTimer = null;

    function persistProgress() {
      clearTimeout(progressSaveTimer);
      if (!state.user.id) return;
      progressSaveTimer = setTimeout(async () => {
        try {
          await saveAuthenticatedProfile();
        } catch (error) {
          console.warn('Progres belum tersimpan:', error.message);
        }
      }, 350);
    }

    function getLocalDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function markSessionProgress(topicTitle, totalScore, wpm, matchedWords = 0) {
      state.recording.sessionCompleted = true;

      // Logika Streak Harian Nyata (berdasarkan tanggal lokal pengguna)
      const todayKey = getLocalDateKey();
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayKey = getLocalDateKey(yesterday);
      const streakStorageKey = state.user.id ? `speakup_last_practice_${state.user.id}` : 'speakup_last_practice_guest';
      const lastPracticeDate = safeStorageGet(streakStorageKey);

      if (lastPracticeDate !== todayKey) {
        if (lastPracticeDate === yesterdayKey && state.user.streak > 0) {
          state.user.streak = Number(state.user.streak) + 1;
        } else {
          state.user.streak = Math.max(1, Number(state.user.streak) === 0 ? 1 : Number(state.user.streak));
        }
        safeStorageSet(streakStorageKey, todayKey);
      }

      // Tambah kosakata baru & progres mingguan hanya jika ada kata yang benar (bukan skor 0)
      const earnedWords = totalScore >= 60 ? Math.max(1, Math.min(4, Math.floor(matchedWords / 3))) : totalScore >= 30 ? 1 : 0;
      const earnedWeekly = totalScore >= 75 ? 25 : totalScore >= 50 ? 15 : totalScore >= 30 ? 10 : 0;

      state.user.newWords = Math.max(0, Number(state.user.newWords) || 0) + earnedWords;
      state.user.weeklyProgress = Math.min(100, (Number(state.user.weeklyProgress) || 0) + earnedWeekly);

      const now = new Date();
      const dateLabel = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} - ${now.getDate()}/${now.getMonth() + 1}`;
      savePracticeHistoryEntry({
        topicTitle: topicTitle || getCurrentTopic().title,
        totalScore,
        wpm,
        dateLabel,
        level: state.user.level
      });

      persistProgress();
    }

        ? 'border-mint-500 text-mint-700'
        : r.totalScore >= 60
          ? 'border-amber-500 text-amber-700'
          : 'border-rose-500 text-rose-700';

      return `

            <div class="flex items-center justify-between">

                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
              </button>
              <h1 class="font-display text-lg font-extrabold text-slate-900">Hasil latihan</h1>
              <div class="w-8"></div>
            </div>

            <!-- Kotak Transkrip Target dengan Highlight -->
            <div class="bg-white rounded-3xl p-4 border border-slate-200/90 shadow-sm space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-semibold text-slate-400">Evaluasi per kata:</span>
                <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-rose-600">
                  <span class="w-2 h-2 rounded-full bg-rose-500"></span> Perlu diperbaiki
                </span>
              </div>
              <p class="font-display text-base font-bold text-slate-800 leading-relaxed">
                ${r.transcriptWords.map(w =>
        w.error
          ? `<span class="px-1.5 py-0.5 rounded-lg bg-rose-100 text-rose-600 underline decoration-rose-400 decoration-wavy" title="Diharapkan: ${escapeHtml(w.expected || w.text)}">${escapeHtml(w.text)}</span>`
          : `<span class="text-slate-800">${escapeHtml(w.text)}</span>`
      ).join(' ')}
              </p>
              ${r.spokenRaw ? `
                <div class="pt-2 border-t border-slate-100">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Yang kamu ucapkan:</span>
                  <p class="text-xs text-slate-600 italic mt-0.5">"${escapeHtml(r.spokenRaw)}"</p>
                </div>
              ` : ''}
            </div>

    async function analyzeCustomPhrase() {
      const inputEl = document.getElementById('translate-input');
      const phrase = inputEl ? inputEl.value.trim() : '';
      if (!phrase) return;
      if (phrase.length > 300) {
        showToast('Frasa maksimal 300 karakter.', 'warning');
        return;
      }

      state.translation.inputText = phrase;
      state.translation.isLoading = true;
      render();
      try {
        const result = await apiRequest('/api/translate', {
          method: 'POST',
          body: JSON.stringify({ phrase })
        });
        state.translation.meaning = result.meaning;
        state.translation.phonetic = result.phonetic;
        state.translation.explanation = result.explanation;
        state.user.newWords += 1;
        persistProgress();
      } catch (error) {
        // Offline fallback tetap memberi hasil berguna tanpa API key.
        const local = analyzePhraseLocally(phrase);
        state.translation.meaning = local.meaning;
        state.translation.phonetic = local.phonetic;
        state.translation.explanation = local.explanation;
        showToast('Layanan AI tidak tersedia. Menggunakan kamus offline.', 'info');
      } finally {
        state.translation.isLoading = false;
        render();
      }
    }

    function setQuizTier(tier) {
      state.quiz.selectedTier = tier;
      state.quiz.questions = buildQuizSession(tier, state.quiz.shuffleQuestions);
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.combo = 0;
      state.quiz.answered = null;
      render();
    }

    function toggleQuizOrder() {
      state.quiz.shuffleQuestions = !state.quiz.shuffleQuestions;
      state.quiz.questions = buildQuizSession(state.quiz.selectedTier, state.quiz.shuffleQuestions);
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.combo = 0;
      state.quiz.answered = null;
      showToast(state.quiz.shuffleQuestions ? 'Urutan soal & opsi diacak.' : 'Urutan soal berjenjang 1-100 (opsi tetap acak).', 'info');
      render();
    }

    function answerQuiz(idx) {
      if (state.quiz.answered !== null) return;
      const currentQ = state.quiz.questions[state.quiz.currentIndex];
      if (!currentQ) return;
      state.quiz.answered = idx;
      if (idx === currentQ.answer) {
        state.quiz.score += 1;
        state.quiz.combo += 1;
        if (state.quiz.combo > state.quiz.bestCombo) state.quiz.bestCombo = state.quiz.combo;
        if (!state.quiz.completedIds.includes(currentQ.id)) {
          state.quiz.completedIds.push(currentQ.id);
          state.user.newWords += 1;
          persistProgress();
        }
        saveQuizProgress();
      } else {
        state.quiz.combo = 0;
      }
      render();
    }

    function nextQuizQuestion() {
      state.quiz.currentIndex += 1;
      state.quiz.answered = null;
      render();
    }

    function resetQuiz() {
      state.quiz.questions = buildQuizSession(state.quiz.selectedTier, state.quiz.shuffleQuestions);
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.combo = 0;
      state.quiz.answered = null;
      render();
    }

    async function changeProfileLevel(lvl) {
      if (state.user.level === lvl) return;
      state.user.level = lvl;
      state.selectedTopicIndex = 0;
      state.topics = getActiveTopics();
      state.quiz.selectedTier = lvl;
      state.quiz.questions = buildQuizSession(lvl, state.quiz.shuffleQuestions);
      state.quiz.currentIndex = 0;
      state.quiz.score = 0;
      state.quiz.combo = 0;
      state.quiz.answered = null;
      try {
        await saveAuthenticatedProfile({ level: lvl });
        showToast(`Level diubah ke ${lvl}. Materi & kuis disesuaikan!`, 'success');
        render();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function changeProfileEducation(edu) {
      if (state.user.education === edu) return;
      state.user.education = edu;
      try {
        await saveAuthenticatedProfile({ education: edu });
        showToast(`Jenjang diubah ke ${edu}.`, 'success');
        render();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

      try {

        state.user = {

          provider: 'email',

          googleEmail: '',
          education: 'SMA',
          level: 'Pemula',
          streak: 0,
          newWords: 0,
          weeklyProgress: 0,
          reminderTime: '19:00',

          privacyAgreed: false,

    async function updateReminderTime(val) {
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(val)) {
        showToast('Format waktu pengingat tidak valid.', 'warning');
        render();
        return;
      }
      const previous = state.user.reminderTime;
      state.user.reminderTime = val;
      try {
        await saveAuthenticatedProfile();
        showToast(`Pengingat harian diatur ke pukul ${val}`, 'success');
        render();
      } catch (error) {
        state.user.reminderTime = previous;
        showToast(error.message, 'error');
        render();
      }
    }

        state.vocab.masteredIds = parsed && Array.isArray(parsed.masteredIds) ? parsed.masteredIds : [];

    function getUserRankInfo() {
      const practiceXp = state.practiceHistory.reduce((sum, item) => sum + Math.round((Number(item.totalScore) || 0) * 0.5), 0);
      const quizXp = state.quiz.completedIds.length * 15;
      const vocabXp = state.vocab.masteredIds.length * 10;
      const roleplayXp = state.roleplay.completedScenarios.length * 40;
      const xp = practiceXp + quizXp + vocabXp + roleplayXp;

      const tiers = [
        { rankNum: 1, title: 'Rookie', min: 0, max: 150 },
        { rankNum: 2, title: 'Explorer', min: 150, max: 400 },
        { rankNum: 3, title: 'Speaker', min: 400, max: 850 },
        { rankNum: 4, title: 'Orator', min: 850, max: 1500 },
        { rankNum: 5, title: 'Master', min: 1500, max: 2500 }
      ];
      let current = tiers[0];
      for (const t of tiers) {
        if (xp >= t.min) current = t;
      }
      const span = Math.max(1, current.max - current.min);
      const pct = Math.min(100, Math.round(((xp - current.min) / span) * 100));
      return { ...current, xp, pct };
    }

      const sessionsCount = state.practiceHistory.length;
      const quizCount = state.quiz.completedIds.length;
      const vocabCount = state.vocab.masteredIds.length;

          title: 'Selesaikan 1 sesi Voice Note',

    }

    // ---------- 13B. AI ROLEPLAY PERCAKAPAN ----------
    function startRoleplayScenario(scenarioId) {
      const scenario = ROLEPLAY_SCENARIOS.find(s => s.id === scenarioId);
      if (!scenario) return;
      state.roleplay.activeScenarioId = scenario.id;
      state.roleplay.stepIndex = 0;
      const firstTurn = scenario.turns[0];
      state.roleplay.messages = [
        { role: 'ai', text: firstTurn.ai, sub: firstTurn.idText }
      ];
      speakEnglish(firstTurn.ai);
      render();
    }

    function exitRoleplayScenario() {
      if (state.roleplay.recognition) {
        try { state.roleplay.recognition.stop(); } catch { }
        state.roleplay.recognition = null;
      }
      state.roleplay.isListening = false;
      state.roleplay.activeScenarioId = null;
      render();
    }

    function sendRoleplayReply(rawText) {
      const text = String(rawText || '').trim();
      if (!text) return;
      const scenario = ROLEPLAY_SCENARIOS.find(s => s.id === state.roleplay.activeScenarioId);
      if (!scenario) return;

      const currentTurn = scenario.turns[state.roleplay.stepIndex];
      const wordCount = text.split(/\s+/).filter(Boolean).length;
      const coachNote = wordCount >= 5
        ? `Bagus! Kalimatmu lengkap (${wordCount} kata). ${currentTurn.tip}`
        : `Jawaban singkat (${wordCount} kata). Coba kembangkan kalimatmu. ${currentTurn.tip}`;

      state.roleplay.messages.push({ role: 'user', text, coachNote });
      state.roleplay.stepIndex += 1;

      if (state.roleplay.stepIndex < scenario.turns.length) {
        const nextTurn = scenario.turns[state.roleplay.stepIndex];
        state.roleplay.messages.push({ role: 'ai', text: nextTurn.ai, sub: nextTurn.idText });
        speakEnglish(nextTurn.ai);
      } else {
        const closingMsg = "Excellent job! You completed this roleplay conversation naturally and confidently.";
        state.roleplay.messages.push({ role: 'ai', text: closingMsg, sub: 'Skenario selesai! Kamu mendapatkan +40 XP.' });
        if (!state.roleplay.completedScenarios.includes(scenario.id)) {
          state.roleplay.completedScenarios.push(scenario.id);
          saveRoleplayProgress();
        }
        speakEnglish(closingMsg);
        showToast('Roleplay selesai! +40 XP ditambahkan.', 'success');
      }
      render();
    }

    function submitRoleplayInput() {
      const input = document.getElementById('roleplay-input');
      if (!input || !input.value.trim()) return;
      const val = input.value.trim();
      input.value = '';
      sendRoleplayReply(val);
    }

    function toggleRoleplayVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Browser tidak mendukung input suara langsung. Gunakan ketik atau saran balasan.', 'warning');
        return;
      }
      if (state.roleplay.isListening && state.roleplay.recognition) {
        try { state.roleplay.recognition.stop(); } catch { }
        state.roleplay.isListening = false;
        render();
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = state.speechSettings.accent || 'en-US';
      recognition.interimResults = false;
      recognition.onresult = (event) => {
        const spoken = event.results[0] && event.results[0][0] ? event.results[0][0].transcript : '';
        state.roleplay.isListening = false;
        if (spoken.trim()) sendRoleplayReply(spoken.trim());
      };
      recognition.onerror = () => {
        state.roleplay.isListening = false;
        showToast('Suara tidak tertangkap. Coba ulangi atau ketik jawabanmu.', 'warning');
        render();
      };
      recognition.onend = () => {
        state.roleplay.isListening = false;
        render();
      };
      state.roleplay.recognition = recognition;
      state.roleplay.isListening = true;
      recognition.start();
      render();
    }

    // ---------- 13C. FLASHCARD KOSAKATA 3D ----------
    function getFilteredVocabCards() {
      const all = getAllVocabCards();
      if (state.vocab.filterLevel === 'Semua') return all;
      return all.filter(c => c.level === state.vocab.filterLevel);
    }

    function setVocabFilter(lvl) {
      state.vocab.filterLevel = lvl;
      state.vocab.currentIndex = 0;
      state.vocab.isFlipped = false;
      render();
    }

    function flipVocabCard() {
      state.vocab.isFlipped = !state.vocab.isFlipped;
      render();
    }

    function markVocabCard(mastered) {
      const list = getFilteredVocabCards();
      const card = list[state.vocab.currentIndex];
      if (!card) return;
      if (mastered) {
        if (!state.vocab.masteredIds.includes(card.id)) {
          state.vocab.masteredIds.push(card.id);
          state.user.newWords += 1;
          persistProgress();
          saveVocabProgress();
        }
        showToast(`"${card.word}" ditandai hafal! +10 XP`, 'success');
      } else {
        state.vocab.masteredIds = state.vocab.masteredIds.filter(id => id !== card.id);
        saveVocabProgress();
        showToast(`"${card.word}" akan diulang lagi.`, 'info');
      }
      state.vocab.isFlipped = false;
      state.vocab.currentIndex = (state.vocab.currentIndex + 1) % Math.max(1, list.length);
      render();
    }

    function toggleVocabAddForm() {
      state.vocab.showAddForm = !state.vocab.showAddForm;
      render();
    }

    function addCustomVocabCard(event) {
      event.preventDefault();
      const word = (document.getElementById('vocab-word-input')?.value || '').trim();
      const meaning = (document.getElementById('vocab-meaning-input')?.value || '').trim();
      const example = (document.getElementById('vocab-example-input')?.value || '').trim();
      if (!word || !meaning) {
        showToast('Isi kata bahasa Inggris dan artinya terlebih dahulu.', 'warning');
        return;
      }
      const newCard = {
        id: 'custom_' + Date.now(),
        level: state.user.level || 'Pemula',
        word,
        phonetic: 'Klik tombol audio untuk mendengar pelafalan',
        meaning,
        example: example || `I use the word "${word}" in my daily speaking practice.`
      };
      state.vocab.customCards.unshift(newCard);
      state.vocab.filterLevel = 'Semua';
      state.vocab.currentIndex = 0;
      state.vocab.isFlipped = false;
      state.vocab.showAddForm = false;
      saveVocabProgress();
      showToast(`Kata "${word}" berhasil ditambahkan ke dek Flashcard!`, 'success');
      render();
    }

            <p class="font-display text-lg font-extrabold leading-relaxed">"${escapeHtml(topic.prompt)}"</p>
            <p class="text-xs text-brand-100">Cara baca: ${escapeHtml(topic.promptPhonetic || topic.samplePhonetic)}</p>
            <p class="text-xs text-mint-200">Arti: ${escapeHtml(topic.promptMeaning || topic.sampleMeaning)}</p>
            <div class="flex gap-2.5 pt-2">
              <button onclick="speakEnglish(${JSON.stringify(topic.prompt).replace(/"/g, '&quot;')})" class="flex-1 py-3 rounded-2xl bg-white text-brand-700 font-bold text-xs shadow-sm">
                Putar Audio (${state.speechSettings.rate === 0.75 ? '0.75x' : state.speechSettings.rate === 1.2 ? '1.25x' : '1.0x'})
              </button>
              <button onclick="state.selectedTopicIndex=${idx}; state.customPromptMode=false; navigate('practice')" class="flex-1 py-3 rounded-2xl bg-mint-500 hover:bg-mint-600 text-white font-bold text-xs shadow-sm">
                Tirukan & Nilai
              </button>
            </div>
          </div>

          <div class="space-y-2">
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Pilih Kalimat Latihan (${escapeHtml(state.user.level)}):</p>
            ${topics.map((t, i) => `
              <button onclick="selectShadowingTopic(${i})" class="w-full p-3.5 rounded-2xl border text-left transition-all ${i === idx ? 'bg-brand-50 border-brand-400' : 'bg-white border-slate-200'}">
                <p class="text-xs font-extrabold text-slate-900">${escapeHtml(t.title)}</p>
                <p class="text-[11px] text-slate-500 truncate mt-0.5">"${escapeHtml(t.prompt)}"</p>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ---------- 13E. ANALITIK PERFORMA & 8 LENCANA PRESTASI ----------
    function renderAnalyticsScreen() {
      const rank = getUserRankInfo();
      const history = state.practiceHistory.slice(0, 7).reverse();
      const avgScore = history.length > 0
        ? Math.round(history.reduce((s, x) => s + (Number(x.totalScore) || 0), 0) / history.length)
        : 0;
      const avgWpm = history.length > 0
        ? Math.round(history.reduce((s, x) => s + (Number(x.wpm) || 0), 0) / history.length)
        : 0;
      const bestScore = history.length > 0
        ? Math.max(...history.map(x => Number(x.totalScore) || 0))
        : 0;
      const quizPct = Math.round((state.quiz.completedIds.length / QUIZ_BANK_100.length) * 100);

      const badges = [
        { name: 'Langkah Pertama', desc: 'Selesaikan 1 sesi speaking', unlocked: state.practiceHistory.length >= 1 },
        { name: 'Api Konsisten', desc: 'Capai streak minimal 3 hari', unlocked: state.user.streak >= 3 },
        { name: 'Suara Emas 90+', desc: 'Raih skor speaking minimal 90', unlocked: bestScore >= 90 },
        { name: 'Penakluk 10 Kuis', desc: 'Kuasai 10 soal di Kuis Cepat', unlocked: state.quiz.completedIds.length >= 10 },
        { name: 'Ahli 50 Kuis', desc: 'Kuasai 50 soal di Kuis Cepat', unlocked: state.quiz.completedIds.length >= 50 },
        { name: 'Master 100 Kuis', desc: 'Tamatkan seluruh 100 kuis', unlocked: state.quiz.completedIds.length >= 100 },
        { name: 'Kolektor Kata', desc: 'Hafalkan 5 kosakata Flashcard', unlocked: state.vocab.masteredIds.length >= 5 },
        { name: 'Bintang Roleplay', desc: 'Tamatkan 2 skenario Roleplay', unlocked: state.roleplay.completedScenarios.length >= 2 }
      ];
      const unlockedCount = badges.filter(b => b.unlocked).length;

      return `
        <div class="screen-enter p-5 space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="navigate('studio')" class="p-2 -ml-2 rounded-xl text-slate-500 hover:bg-slate-200/60">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="font-display text-lg font-extrabold text-slate-900">Analitik & Lencana</h1>
            <span class="px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-bold">${unlockedCount}/${badges.length}</span>
          </div>

          <!-- Ringkasan XP & KPI -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white rounded-2xl p-3 border border-slate-200 text-center">
              <p class="font-display text-lg font-extrabold text-brand-600">${avgScore}</p>
              <p class="text-[10px] font-semibold text-slate-500">Rata-rata Skor</p>
            </div>
            <div class="bg-white rounded-2xl p-3 border border-slate-200 text-center">
              <p class="font-display text-lg font-extrabold text-mint-600">${avgWpm || '-'}</p>
              <p class="text-[10px] font-semibold text-slate-500">Rata-rata WPM</p>
            </div>
            <div class="bg-white rounded-2xl p-3 border border-slate-200 text-center">
              <p class="font-display text-lg font-extrabold text-purple-600">${rank.xp}</p>
              <p class="text-[10px] font-semibold text-slate-500">Total XP</p>
            </div>
          </div>

          <!-- Grafik Batang Tren Skor -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-xs font-extrabold text-slate-800">Grafik 7 Sesi Terakhir</h2>
              <span class="text-[11px] font-bold text-brand-600">Terbaik: ${bestScore}</span>
            </div>
            ${history.length === 0 ? `
              <p class="text-xs text-slate-400 text-center py-6">Belum ada riwayat rekaman. Mulai latihan speaking untuk melihat grafikmu.</p>
            ` : `
              <div class="flex items-end justify-between gap-2 h-32 pt-4 px-1">
                ${history.map((item, i) => {
                  const s = Math.max(4, Number(item.totalScore) || 0);
                  const barColor = s >= 80 ? 'bg-mint-500' : s >= 60 ? 'bg-brand-500' : 'bg-rose-400';
                  return `
                    <div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
                      <span class="text-[10px] font-extrabold text-slate-600">${item.totalScore}</span>
                      <div class="w-full rounded-t-xl ${barColor} transition-all" style="height: ${s}%"></div>
                      <span class="text-[9px] text-slate-400 font-semibold">S${i + 1}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <!-- Progres Penguasaan Skill -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
            <h2 class="text-xs font-extrabold text-slate-800">Peta Penguasaan</h2>
            ${[
              { label: 'Kuis Progresif (100 Soal)', pct: quizPct, val: `${state.quiz.completedIds.length}/100`, color: 'bg-brand-500' },
              { label: 'Flashcard Kosakata', pct: Math.round((state.vocab.masteredIds.length / Math.max(1, getAllVocabCards().length)) * 100), val: `${state.vocab.masteredIds.length}/${getAllVocabCards().length}`, color: 'bg-mint-500' },
              { label: 'AI Roleplay Skenario', pct: Math.round((state.roleplay.completedScenarios.length / ROLEPLAY_SCENARIOS.length) * 100), val: `${state.roleplay.completedScenarios.length}/${ROLEPLAY_SCENARIOS.length}`, color: 'bg-purple-500' }
            ].map(row => `
              <div>
                <div class="flex justify-between text-[11px] font-bold mb-1">
                  <span class="text-slate-700">${row.label}</span>
                  <span class="text-slate-500">${row.val}</span>
                </div>
                <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div class="h-full rounded-full ${row.color}" style="width: ${row.pct}%"></div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- 8 Lencana Prestasi -->
          <div class="space-y-2.5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Lencana Prestasi (${unlockedCount}/${badges.length})</h2>
            <div class="grid grid-cols-2 gap-2.5">
              ${badges.map(b => `
                <div class="p-3.5 rounded-2xl border ${b.unlocked ? 'bg-amber-50/70 border-amber-300' : 'bg-white border-slate-200 opacity-60'}">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="w-7 h-7 rounded-xl flex items-center justify-center ${b.unlocked ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-500'}">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </span>
                    <span class="text-[10px] font-extrabold ${b.unlocked ? 'text-amber-700' : 'text-slate-400'}">${b.unlocked ? 'Terbuka' : 'Terkunci'}</span>
                  </div>
                  <p class="text-xs font-extrabold text-slate-900">${b.name}</p>
                  <p class="text-[10px] text-slate-500 mt-0.5">${b.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Inisialisasi aplikasi saat halaman dimuat (1.2 Splash -> 1.3 Cek sesi / Onboarding 3 layar)
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && state.googleModal.isOpen) closeGoogleAccountModal();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      state.darkMode = safeStorageGet('speakup_dark_mode') === '1';
      applyDarkModeClass();
      loadVocabProgress();
      loadRoleplayProgress();
      const reset = new URLSearchParams(window.location.search).get('reset');
      if (reset && /^[a-f0-9]{64}$/.test(reset)) state.resetToken = reset;
      try {
        const config = await apiRequest('/api/config');
        if (config && config.googleClientId) state.googleClientId = config.googleClientId;
        if (config && typeof config.googleClientIdIsDefault === 'boolean') {
          state.googleClientIdIsDefault = config.googleClientIdIsDefault;
        }
      } catch {
        // Konfigurasi default tetap digunakan saat halaman dibuka offline.
      }
      render();
      renderGoogleModal();
      clearTimeout(state.splashTimer);
      state.splashTimer = setTimeout(async () => {
        await checkSessionAfterSplash();
      }, 1500);
    });
  </script>
</body>

</html>
